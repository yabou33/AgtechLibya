<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parcours guidé — AgriTech Libye</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="platform/public/assets/css/theme.css">
<style>
  [hidden]{display:none!important}
  .wrap{max-width:1000px;margin:0 auto;padding:18px 20px 48px}
  .lead{color:var(--muted);max-width:820px;margin:-2px 0 16px;font-size:14px}
  .lead b{color:var(--ink)}
  /* progress */
  .progwrap{position:sticky;top:64px;z-index:20;background:var(--paper);padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:22px}
  .progbar{height:12px;background:var(--green-bg);border:1px solid var(--line);border-radius:20px;overflow:hidden}
  .progfill{height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--green-d));transition:width .4s}
  .progtxt{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;font-size:13px;color:var(--muted)}
  .progtxt b{color:var(--green-d);font-size:15px;font-weight:800}
  /* rail */
  .rail{position:relative}
  .rail::before{content:"";position:absolute;inset-inline-start:23px;top:12px;bottom:12px;width:2px;background:var(--line)}
  body[data-lang=ar] .rail::before{inset-inline-start:auto;inset-inline-end:23px}
  .step{position:relative;display:flex;gap:18px;margin-bottom:16px;align-items:flex-start}
  .stepnum{flex:none;width:48px;height:48px;border-radius:50%;background:#fff;border:3px solid var(--sc,var(--green));color:var(--sc,var(--green-d));font-weight:800;font-size:1.1rem;display:grid;place-items:center;z-index:1;transition:.2s}
  .step.done .stepnum{background:var(--sc,var(--green));color:#fff}
  .card2{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-inline-start:4px solid var(--sc,var(--green));border-radius:14px;box-shadow:var(--shadow);padding:15px 18px}
  .card2 .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .card2 .ttl{font-weight:800;font-size:1.05rem}
  .card2 .icon{font-size:1.3rem}
  .diff{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:2px 9px;border-radius:20px;margin-inline-start:auto}
  .diff.d1{background:#eaf4fb;color:#2b7bb0}.diff.d2{background:#fdf3e3;color:#b5701a}.diff.d3{background:#fbecea;color:#c0392b}
  .card2 .desc{color:var(--muted);font-size:13.5px;margin:8px 0 12px;line-height:1.5}
  .card2 .desc b{color:var(--ink)}
  .acts{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .obtn{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:13.5px;color:#fff;background:var(--sc,var(--green));border:none;border-radius:9px;padding:9px 15px;text-decoration:none;transition:.15s}
  .obtn:hover{filter:brightness(1.07)}
  .obtn.alt{background:#fff;color:var(--sc,var(--green-d));border:1.5px solid var(--sc,var(--green-l))}
  .obtn.alt:hover{background:var(--green-bg)}
  .donebox{display:inline-flex;align-items:center;gap:7px;margin-inline-start:auto;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
  .donebox input{width:17px;height:17px;accent-color:var(--green)}
  .foot{margin-top:24px;text-align:center}
  .rst{font:inherit;font-size:12.5px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer}
  .rst:hover{border-color:var(--green)}
  .endcard{background:linear-gradient(160deg,#fff,var(--green-bg));border:2px solid var(--green-l);border-radius:16px;padding:20px;text-align:center;margin-top:8px}
  .endcard b{color:var(--green-d)}
</style>
</head>
<body>

<header class="app">
  <div class="logo"><span class="es-logo">🎓</span> <b data-i18n="pc_brand">Parcours</b> <span data-i18n="pc_brand2">guidé</span></div>
  <div class="sub" data-i18n="pc_sub">Du simple au complexe · de la parcelle à l'IA</div>
  <div class="right">
    <a class="chip" href="platform/public/index.html" style="text-decoration:none" data-i18n="pc_home">← Accueil</a>
    <div class="langbox">
      <button data-lang="fr" onclick="I18N.set('fr')">FR</button>
      <button data-lang="ar" onclick="I18N.set('ar')">ع</button>
      <button data-lang="en" onclick="I18N.set('en')">EN</button>
    </div>
  </div>
</header>

<div class="wrap">
  <p class="lead" data-i18n-html="pc_lead"></p>

  <div class="progwrap">
    <div class="progtxt"><span data-i18n="pc_progress">Progression</span> <span><b id="pdone">0</b>/<span id="ptot">0</span></span></div>
    <div class="progbar"><div class="progfill" id="pfill"></div></div>
  </div>

  <div class="rail" id="rail"></div>

  <div class="foot">
    <button class="rst" onclick="resetProg()" data-i18n="pc_reset">↺ Réinitialiser ma progression</button>
  </div>
</div>

<script src="platform/public/assets/i18n/i18n.js"></script>
<script src="platform/public/assets/js/store.js"></script>
<script>
const $=id=>document.getElementById(id);

Object.assign(I18N.DICT,{
  pc_brand:{fr:"Parcours",ar:"مسار",en:"Path"},
  pc_brand2:{fr:"guidé",ar:"موجّه",en:"guided"},
  pc_sub:{fr:"Du simple au complexe · de la parcelle à l'IA",ar:"من البسيط إلى المعقّد · من القطعة إلى الذكاء الاصطناعي",en:"From simple to complex · from parcel to AI"},
  pc_home:{fr:"← Accueil",ar:"→ الرئيسية",en:"← Home"},
  pc_lead:{fr:"Un chemin d'apprentissage <b>du plus simple au plus complexe</b>. On commence par le geste de base — <b>dessiner une parcelle et l'exporter</b> — puis on observe (imagerie), on mesure (capteurs), on comprend le climat, on décide l'irrigation, on explore la ressource souterraine, on gère la ferme, et enfin l'IA. Suivez les étapes dans l'ordre et cochez à mesure.",
           ar:"مسار تعلّم <b>من الأبسط إلى الأعقد</b>. نبدأ بالحركة الأساسية — <b>رسم قطعة وتصديرها</b> — ثم نلاحظ (الصور)، نقيس (المجسّات)، نفهم المناخ، نقرّر الريّ، نستكشف المورد الجوفي، ندير المزرعة، وأخيراً الذكاء الاصطناعي. اتبع الخطوات بالترتيب وأشّر كلما تقدّمت.",
           en:"A learning path <b>from simplest to most complex</b>. Start with the basic gesture — <b>draw a parcel and export it</b> — then observe (imagery), measure (sensors), understand climate, decide irrigation, explore the underground resource, manage the farm, and finally AI. Follow the steps in order and tick as you go."},
  pc_progress:{fr:"Progression",ar:"التقدّم",en:"Progress"},
  pc_reset:{fr:"↺ Réinitialiser ma progression",ar:"↺ إعادة ضبط تقدّمي",en:"↺ Reset my progress"},
  pc_open:{fr:"Ouvrir l'app",ar:"افتح التطبيق",en:"Open the app"},
  pc_lesson:{fr:"📗 Cours",ar:"📗 الدرس",en:"📗 Lesson"},
  pc_tp:{fr:"🧪 TP",ar:"🧪 تطبيق",en:"🧪 Lab"},
  pc_done:{fr:"Fait",ar:"تمّ",en:"Done"},
  pc_end_t:{fr:"🎉 Parcours terminé !",ar:"🎉 اكتمل المسار!",en:"🎉 Path complete!"},
  pc_end_d:{fr:"Vous avez parcouru toute la chaîne de valeur, du geste de terrain à l'intelligence artificielle. Revenez à l'accueil pour approfondir chaque domaine.",ar:"لقد قطعت كامل سلسلة القيمة، من الحركة الميدانية إلى الذكاء الاصطناعي. عُد إلى الرئيسية لتعميق كل مجال.",en:"You've walked the whole value chain, from field gesture to artificial intelligence. Head back to the home page to go deeper in each domain."},
  d1:{fr:"Découverte",ar:"اكتشاف",en:"Beginner"},
  d2:{fr:"Intermédiaire",ar:"متوسّط",en:"Intermediate"},
  d3:{fr:"Avancé",ar:"متقدّم",en:"Advanced"}
});

/* Étapes : du simple au complexe. sc=couleur (place sur la chaîne), diff 1..3 */
const STEPS=[
  {icon:"✏️",sc:"#3a9bd0",diff:1,app:"platform/public/apps/carto.html",
   t:{fr:"Dessiner une parcelle & l'exporter",en:"Draw a parcel & export it",ar:"ارسم قطعة وصدّرها"},
   d:{fr:"Le geste fondateur. Dessinez une <b>parcelle</b> (polygone) ou un <b>pivot</b> sur la carte, nommez-la, puis <b>exportez</b> en GeoJSON et réimportez-la. Tout part de là.",en:"The founding gesture. Draw a <b>parcel</b> (polygon) or a <b>pivot</b> on the map, name it, then <b>export</b> to GeoJSON and re-import. Everything starts here.",ar:"الحركة الأساسية. ارسم <b>قطعة</b> (مضلّع) أو <b>محور</b> على الخريطة، سمّها، ثم <b>صدّرها</b> بصيغة GeoJSON وأعِد استيرادها. كل شيء يبدأ من هنا."}},
  {icon:"🛰️",sc:"#3a9bd0",diff:1,app:"agrisim_live.html",
   t:{fr:"Observer par imagerie satellite",en:"Observe with satellite imagery",ar:"لاحظ عبر صور الأقمار"},
   d:{fr:"Sur votre parcelle, chargez une image <b>Sentinel-2</b> réelle et calculez des <b>indices</b> (NDVI, NDWI, NDRE). Voyez le stress avant l'œil et lisez une série temporelle.",en:"On your parcel, load a real <b>Sentinel-2</b> image and compute <b>indices</b> (NDVI, NDWI, NDRE). Spot stress before the eye and read a time series.",ar:"على قطعتك، حمّل صورة <b>Sentinel-2</b> حقيقية واحسب <b>المؤشرات</b> (NDVI، NDWI، NDRE). اكتشف الإجهاد قبل العين واقرأ سلسلة زمنية."}},
  {icon:"🌱",sc:"#8e6fc7",diff:2,app:"sondes-iot.html",lesson:null,
   t:{fr:"Mesurer au sol avec des capteurs",en:"Measure on the ground with sensors",ar:"قِس على الأرض بالمجسّات"},
   d:{fr:"Passez du ciel au sol : lisez des <b>sondes d'humidité multi-profondeur</b>, repérez irrigation/drainage, et découvrez la réserve utile (bilan FAO-56) et la calibration des sondes.",en:"From sky to soil: read <b>multi-depth moisture probes</b>, spot irrigation/drainage, and discover available water (FAO-56 balance) and probe calibration.",ar:"من السماء إلى التربة: اقرأ <b>مجسّات الرطوبة متعددة الأعماق</b>، وميّز الريّ/الصرف، واكتشف المخزون المتاح (ميزان FAO-56) ومعايرة المجسّات."}},
  {icon:"🌦️",sc:"#7cb342",diff:2,app:"meteo-et0.html",
   t:{fr:"Comprendre le climat : météo & ET₀",en:"Understand climate: weather & ET₀",ar:"افهم المناخ: الطقس وET₀"},
   d:{fr:"Importez des <b>données de station météo</b>, calculez l'<b>ET₀ FAO-56</b> (Penman-Monteith) et les GDD. C'est la demande en eau qui pilote toute l'irrigation.",en:"Import <b>weather-station data</b>, compute <b>ET₀ FAO-56</b> (Penman-Monteith) and GDD. This is the water demand that drives all irrigation.",ar:"استورد <b>بيانات محطة الطقس</b>، احسب <b>ET₀ FAO-56</b> (Penman-Monteith) وGDD. هذا هو الطلب على الماء الذي يقود كل الريّ."}},
  {icon:"💧",sc:"#7cb342",diff:2,app:"planificateur-irrigation.html",
   t:{fr:"Décider & planifier l'irrigation",en:"Decide & plan irrigation",ar:"قرّر وخطّط الريّ"},
   d:{fr:"Assemblez culture + climat + sol en un <b>plan d'irrigation décadaire</b> (FAO-56), puis re-planifiez sous contrainte d'un <b>forage plafonné</b> (déficit contrôlé RDI).",en:"Combine crop + climate + soil into a <b>ten-day irrigation plan</b> (FAO-56), then re-plan under a <b>capped well</b> constraint (regulated deficit RDI).",ar:"اجمع المحصول + المناخ + التربة في <b>خطة ريّ عشارية</b> (FAO-56)، ثم أعِد التخطيط تحت قيد <b>بئر محدود</b> (عجز مُتحكَّم RDI)."}},
  {icon:"⛰️",sc:"#e0912b",diff:3,app:"explorateur-aquiferes.html",lesson:"cours-geologie-hydro.html",tp:"tp-geologie-hydro.html",
   t:{fr:"Explorer la ressource souterraine",en:"Explore the underground resource",ar:"استكشف المورد الجوفي"},
   d:{fr:"D'où vient l'eau ? Explorez les <b>aquifères libyens</b> et le grès de Nubie (eau fossile), lisez un <b>log de forage</b> et un essai de pompage. Cours + TP disponibles.",en:"Where does the water come from? Explore <b>Libyan aquifers</b> and the Nubian sandstone (fossil water), read a <b>borehole log</b> and a pumping test. Lesson + lab available.",ar:"من أين يأتي الماء؟ استكشف <b>الخزّانات الليبية</b> والحجر الرملي النوبي (ماء أحفوري)، اقرأ <b>سجل حفر</b> واختبار ضخّ. الدرس والتطبيق متاحان."}},
  {icon:"🚜",sc:"#3fa66a",diff:3,app:"J4/agrimanager-v1.6.html",
   t:{fr:"Piloter l'exploitation (FMIS)",en:"Run the farm (FMIS)",ar:"أدِر المزرعة (FMIS)"},
   d:{fr:"Le cockpit : réunissez parcelles, opérations, <b>coûts de production</b>, traçabilité et AgriScore. Tout ce que vous avez mesuré converge ici pour décider à l'échelle de la ferme.",en:"The cockpit: bring together parcels, operations, <b>production costs</b>, traceability and AgriScore. Everything you measured converges here to decide farm-wide.",ar:"قمرة القيادة: اجمع القطع والعمليات و<b>تكاليف الإنتاج</b> والتتبّع وAgriScore. كل ما قِسته يتجمّع هنا للقرار على مستوى المزرعة."}},
  {icon:"🤖",sc:"#d1584e",diff:3,app:"J5/sim-ia-tomcast.html",
   t:{fr:"Ajouter l'intelligence artificielle",en:"Add artificial intelligence",ar:"أضِف الذكاء الاصطناعي"},
   d:{fr:"La couche intelligente : <b>détection de maladies</b> par vision, modèle <b>TomCast</b> de risque, prédiction. Et surtout : quand faire confiance au modèle, et quand l'humain tranche.",en:"The intelligent layer: <b>disease detection</b> by vision, the <b>TomCast</b> risk model, prediction. And crucially: when to trust the model, and when the human decides.",ar:"الطبقة الذكية: <b>كشف الأمراض</b> بالرؤية، نموذج <b>TomCast</b> للمخاطر، التنبّؤ. والأهم: متى نثق بالنموذج، ومتى يقرّر الإنسان."}}
];

const LS="parcours_v1";
let done={};
try{done=JSON.parse(localStorage.getItem(LS)||"{}")||{};}catch(e){done={};}
function save(){try{localStorage.setItem(LS,JSON.stringify(done));}catch(e){}}

function render(){
  const L=I18N.lang;
  $('rail').innerHTML=STEPS.map((s,i)=>{
    const isDone=!!done[i];
    const acts=[`<a class="obtn" href="${s.app}" target="_blank" rel="noopener">${s.icon} ${I18N.t('pc_open')} ↗</a>`];
    if(s.lesson) acts.push(`<a class="obtn alt" href="${s.lesson}" target="_blank" rel="noopener">${I18N.t('pc_lesson')}</a>`);
    if(s.tp) acts.push(`<a class="obtn alt" href="${s.tp}" target="_blank" rel="noopener">${I18N.t('pc_tp')}</a>`);
    return `<div class="step ${isDone?'done':''}" style="--sc:${s.sc}">
      <div class="stepnum">${isDone?'✓':(i+1)}</div>
      <div class="card2" style="--sc:${s.sc}">
        <div class="top"><span class="icon">${s.icon}</span><span class="ttl">${s.t[L]||s.t.fr}</span>
          <span class="diff d${s.diff}">${I18N.t('d'+s.diff)}</span></div>
        <div class="desc">${s.d[L]||s.d.fr}</div>
        <div class="acts">${acts.join('')}
          <label class="donebox"><input type="checkbox" ${isDone?'checked':''} onchange="toggle(${i},this.checked)"> ${I18N.t('pc_done')}</label>
        </div>
      </div></div>`;
  }).join('') + endCard();
  updateProg();
}
function endCard(){
  const all=STEPS.every((_,i)=>done[i]);
  if(!all) return '';
  return `<div class="endcard"><h2>${I18N.t('pc_end_t')}</h2><p class="lead" style="margin:8px auto 0">${I18N.t('pc_end_d')}</p></div>`;
}
function toggle(i,v){ done[i]=v; save(); render(); }
function updateProg(){
  const n=STEPS.filter((_,i)=>done[i]).length;
  $('pdone').textContent=n; $('ptot').textContent=STEPS.length;
  $('pfill').style.width=(n/STEPS.length*100)+'%';
}
function resetProg(){ done={}; save(); render(); }

document.addEventListener('i18n:changed',render);
function applyHTML(){document.querySelectorAll('[data-i18n-html]').forEach(el=>el.innerHTML=I18N.t(el.getAttribute('data-i18n-html')));}
document.addEventListener('i18n:changed',applyHTML);

const urlLang=new URLSearchParams(location.search).get('lang');
I18N.set(urlLang||localStorage.getItem('agri_lang')||'fr');
applyHTML(); render();
if(window.Store&&Store.detect) Store.detect();
</script>
</body>
</html>
