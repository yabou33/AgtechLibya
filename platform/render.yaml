# Déploiement 1-clic sur Render.com depuis GitHub (offre gratuite)
# Render lit ce fichier à la racine ; pointer "Root Directory" = platform si besoin.
services:
  - type: web
    name: agritech-libya
    runtime: python
    plan: free
    rootDir: platform
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT
    envVars:
      - key: AGRI_SECRET
        generateValue: true
