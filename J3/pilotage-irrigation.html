<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgriManager · Pilotage de l'irrigation</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css"/>
<style>
:root{
  --bg:#0e1512;--panel:#16201b;--panel-2:#1c2a23;--line:#2b3a30;--line-2:#38493d;
  --ink:#e8efe6;--muted:#8fa596;--faint:#5f7568;
  --water:#2ea8d8;--water-d:#1c7fa8;--soil:#c9a24b;
  --good:#5fb15a;--warn:#d99a2b;--bad:#d1584e;
  --c-tomate:#d1584e;--c-orange:#e08a2b;--c-olivier:#7d9153;--c-ble:#c9a24b;
  --shadow:0 6px 22px rgba(0,0,0,.35);--r:12px;
}
*{box-sizing:border-box}
html,body{height:100%}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-size:15px;line-height:1.45;overflow:hidden}
.tabnum{font-variant-numeric:tabular-nums}
button{font-family:inherit}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
.hidden{display:none!important}

/* topbar */
.topbar{display:flex;align-items:center;gap:14px;padding:10px 16px;background:linear-gradient(180deg,#16201b,#111a15);border-bottom:1px solid var(--line);z-index:30;flex:0 0 auto}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:34px;height:34px;border-radius:9px;flex:none;background:radial-gradient(120% 120% at 30% 20%,#2ea8d8,#155e7d);display:grid;place-items:center;box-shadow:0 0 0 1px rgba(46,168,216,.4) inset}
.logo svg{width:20px;height:20px}
.brand .t1{font-weight:700;letter-spacing:-.01em;font-size:.98rem;white-space:nowrap}
.brand .t2{color:var(--muted);font-size:.74rem;white-space:nowrap}
.spacer{flex:1}
.proj{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:.82rem;padding:6px 12px;border:1px solid var(--line);border-radius:20px;background:#121a15;cursor:pointer}
.proj:hover{border-color:var(--water-d)}
.proj b{color:var(--ink);font-weight:600}
.proj input{background:transparent;border:0;color:var(--ink);font:inherit;font-weight:600;width:130px}
.proj input:focus{outline:none}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good)}
.tbtn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:9px;border:1px solid var(--line);background:#18241d;color:var(--ink);font-size:.84rem;cursor:pointer;white-space:nowrap}
.tbtn:hover{border-color:var(--water-d);background:#1b2b22}
.tbtn svg{width:15px;height:15px;opacity:.85}
.tbtn.primary{background:linear-gradient(180deg,#2ea8d8,#1c7fa8);border-color:#2ea8d8;color:#04202c;font-weight:700}
.tbtn.primary:hover{filter:brightness(1.06)}
.tbtn.primary svg{opacity:1}
.tbtn.ghost{background:transparent}

/* body + map */
.body{position:relative;overflow:hidden;flex:1 1 auto;min-height:0}
#map{position:absolute;inset:0;background:#0b1210}

/* draw toolbar */
.drawbar{position:absolute;top:14px;left:14px;z-index:600;display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px;box-shadow:var(--shadow)}
.drawbar .sep{height:1px;background:var(--line);margin:3px 2px}
.tool{position:relative;width:44px;height:44px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.tool svg{width:22px;height:22px}
.tool:hover{background:#1e2c24;color:var(--ink)}
.tool.on{background:#12303c;border-color:var(--water);color:var(--water)}
.tool .tip{position:absolute;left:52px;top:50%;transform:translateY(-50%);background:#0b120f;border:1px solid var(--line);color:var(--ink);padding:5px 9px;border-radius:7px;font-size:.76rem;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;box-shadow:var(--shadow);z-index:5}
.tool:hover .tip{opacity:1}

/* inspector */
.inspector{position:absolute;top:14px;right:14px;bottom:14px;width:352px;z-index:600;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;min-height:0;max-height:calc(100vh - 28px)}
#insContent{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;height:100%;overflow:hidden}
.ins-head{flex:0 0 auto;padding:13px 15px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:10px;background:linear-gradient(180deg,#1b2a22,#16201b)}
.ins-head .h-t{font-weight:700;font-size:.95rem}
.ins-head .h-s{color:var(--muted);font-size:.75rem;margin-top:2px}
.chip{font-size:.68rem;padding:3px 9px;border-radius:20px;font-weight:700;white-space:nowrap;border:1px solid}
.chip.olivier{background:rgba(125,145,83,.18);color:#a9c07d;border-color:rgba(125,145,83,.5)}
.chip.tomate{background:rgba(209,88,78,.16);color:#e79086;border-color:rgba(209,88,78,.5)}
.chip.orange{background:rgba(224,138,43,.16);color:#eeb26e;border-color:rgba(224,138,43,.5)}
.chip.ble{background:rgba(201,162,75,.16);color:#dcc079;border-color:rgba(201,162,75,.5)}
.chip.cereal{background:rgba(201,162,75,.16);color:#dcc079;border-color:rgba(201,162,75,.5)}
.chip.legume{background:rgba(76,154,90,.16);color:#8fd19a;border-color:rgba(76,154,90,.5)}
.chip.veget{background:rgba(209,88,78,.14);color:#e79086;border-color:rgba(209,88,78,.5)}
.chip.fruit{background:rgba(125,145,83,.16);color:#a9c07d;border-color:rgba(125,145,83,.5)}
.chip.indus{background:rgba(142,90,160,.18);color:#c69fd6;border-color:rgba(142,90,160,.5)}
.chip.forage{background:rgba(121,199,124,.16);color:#9fe0a2;border-color:rgba(121,199,124,.5)}
.ins-tabs{flex:0 0 auto;display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line)}
.ins-tabs button{flex:1;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);font-size:.8rem;padding:8px 4px;cursor:pointer;border-radius:6px 6px 0 0}
.ins-tabs button.on{color:var(--water);border-bottom-color:var(--water);background:#14242c}
.ins-tabs button:hover:not(.on){color:var(--ink)}
.ins-body{padding:14px 15px;overflow-y:auto;flex:1 1 auto;min-height:0}
.ins-body::-webkit-scrollbar{width:8px}
.ins-body::-webkit-scrollbar-thumb{background:#243329;border-radius:4px}
.empty{color:var(--faint);font-size:.86rem;text-align:center;padding:40px 20px;line-height:1.6}
.empty svg{width:40px;height:40px;opacity:.4;margin-bottom:10px}

.fld{margin:0 0 12px}
.fld label{display:block;color:var(--muted);font-size:.76rem;margin:0 0 5px}
.fld input,.fld select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#0e1713;color:var(--ink);font-size:.9rem}
.fld input:focus,.fld select:focus{outline:2px solid var(--water-d);border-color:var(--water)}
.fld .row{display:flex;gap:9px}.fld .row>*{flex:1}
.hint{color:var(--faint);font-size:.72rem;margin-top:4px}

.stat{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px dashed var(--line)}
.stat:last-child{border-bottom:0}
.stat .k{color:var(--muted);font-size:.82rem}
.stat .v{font-weight:700;font-size:1.02rem;font-variant-numeric:tabular-nums}
.stat .v small{color:var(--faint);font-weight:400;font-size:.72rem;margin-inline-start:3px}
.stat .v.water{color:var(--water)}

.gauge{margin:8px 0 16px}
.gauge .track{position:relative;height:26px;border-radius:7px;overflow:hidden;background:linear-gradient(90deg,#3a2420 0%,#3a3320 34%,#1f3a2a 60%,#16404d 100%);border:1px solid var(--line)}
.gauge .fill{position:absolute;top:0;bottom:0;left:0;background:linear-gradient(90deg,rgba(46,168,216,.12),rgba(46,168,216,.5));border-right:2px solid var(--water)}
.gauge .mk{position:absolute;top:-2px;bottom:-2px;width:2px;opacity:.6}
.gauge .mk.pf{background:var(--bad)}.gauge .mk.sr{background:var(--warn)}.gauge .mk.cc{background:var(--water)}
.gauge .cur{position:absolute;top:-5px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid var(--ink);transform:translateX(-6px)}
.gauge .lbls{display:flex;justify-content:space-between;color:var(--faint);font-size:.68rem;margin-top:5px}

.banner{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:10px;font-size:.84rem;margin:2px 0 14px;border:1px solid}
.banner svg{width:18px;height:18px;flex:none;margin-top:1px}
.banner.warn{background:rgba(217,154,43,.12);border-color:rgba(217,154,43,.5);color:#e9be6f}
.banner.good{background:rgba(95,177,90,.12);border-color:rgba(95,177,90,.45);color:#8fd08a}
.banner.bad{background:rgba(209,88,78,.14);border-color:rgba(209,88,78,.5);color:#e79086}
.banner b{display:block;color:var(--ink);margin-bottom:1px}

.eq-list{display:flex;flex-direction:column;gap:8px}
.eq{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);cursor:pointer}
.eq:hover{border-color:var(--line-2)}
.eq .ic{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;flex:none;background:#12211a}
.eq .ic svg{width:19px;height:19px}
.eq .m{flex:1;min-width:0}.eq .m .n{font-weight:600;font-size:.86rem}.eq .m .d{color:var(--muted);font-size:.74rem}
.eq .st{font-size:.7rem;padding:3px 8px;border-radius:20px;font-weight:700}
.eq .st.on{background:rgba(95,177,90,.16);color:#8fd08a}.eq .st.off{background:rgba(143,165,150,.14);color:var(--muted)}
.ic.water{color:var(--water)}.ic.soil{color:var(--soil)}.ic.pump{color:#e08a2b}.ic.well{color:var(--good)}

.section-t{font-size:.74rem;color:var(--muted);margin:16px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.btn-row{display:flex;gap:9px;margin-top:10px}
.btn-row .tbtn{flex:1;justify-content:center}

/* priority ranking (stop conditions) */
.prio{display:flex;flex-direction:column;gap:7px;margin:6px 0 4px}
.prio .cond{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#0e1713}
.prio .cond.off{opacity:.5}
.prio .rank{width:22px;height:22px;border-radius:6px;background:var(--water);color:#04202c;font-weight:700;display:grid;place-items:center;font-size:.78rem;flex:none}
.prio .cn{flex:1;font-size:.85rem;font-weight:600}
.prio .cn small{display:block;color:var(--muted);font-weight:400;font-size:.72rem}
.prio .arrows{display:flex;flex-direction:column;gap:1px}
.prio .arrows button{width:20px;height:15px;border:0;background:#1e2c24;color:var(--muted);cursor:pointer;border-radius:3px;line-height:1;font-size:.6rem}
.prio .arrows button:hover{background:#2a3d31;color:var(--ink)}
.prio .tg{width:34px;height:20px;border-radius:20px;background:#2a3d31;position:relative;cursor:pointer;flex:none;border:0}
.prio .tg.on{background:var(--water)}
.prio .tg::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.prio .tg.on::after{left:16px}
.cond-cfg{padding:2px 0 4px 32px}
.inherit-bar{display:flex;align-items:center;gap:8px;font-size:.76rem;color:var(--muted);padding:8px 10px;background:#14212a;border:1px solid var(--water-d);border-radius:8px;margin-bottom:10px}
.inherit-bar .tg{margin-left:auto}

/* dock */
.dock{position:absolute;left:14px;bottom:14px;z-index:600;display:flex;gap:12px;align-items:stretch;max-width:calc(100% - 396px)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:11px 14px}
.legend{display:flex;flex-direction:column;gap:6px;min-width:132px}
.legend .lt{color:var(--muted);font-size:.72rem;margin-bottom:1px}
.lg{display:flex;align-items:center;gap:8px;font-size:.8rem;cursor:default}
.lg .sw{width:12px;height:12px;border-radius:3px;flex:none;border:1px solid rgba(255,255,255,.15)}
.meteo{display:flex;align-items:center;gap:16px}
.meteo .now{display:flex;align-items:center;gap:11px;padding-inline-end:16px;border-inline-end:1px solid var(--line)}
.meteo .temp{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.meteo .loc{color:var(--muted);font-size:.74rem}.meteo .loc b{color:var(--ink);font-weight:600;display:block;font-size:.82rem}
.meteo .days{display:flex;gap:13px}
.meteo .d{text-align:center;font-size:.72rem;color:var(--muted)}
.meteo .d .dv{color:var(--ink);font-weight:700;font-size:.86rem;margin-top:2px}
.meteo .et0v{color:var(--water);font-weight:700}
.src{font-size:.66rem;color:var(--faint);margin-top:5px;text-align:center}
.meteo-load{color:var(--muted);font-size:.8rem;padding:6px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(6,10,8,.72);z-index:1000;display:grid;place-items:center;padding:20px}
.modal{background:var(--panel);border:1px solid var(--line-2);border-radius:16px;box-shadow:var(--shadow);width:min(960px,96vw);max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,#1b2a22,#16201b)}
.modal-head h2{margin:0;font-size:1.08rem}
.modal-head .x{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#18241d;color:var(--muted);cursor:pointer;font-size:1.1rem}
.modal-head .x:hover{color:var(--ink);border-color:var(--bad)}
.modal-body{padding:18px 20px;overflow-y:auto}
.modal-body::-webkit-scrollbar{width:9px}.modal-body::-webkit-scrollbar-thumb{background:#243329;border-radius:4px}

/* planning table */
.ptbl{width:100%;border-collapse:collapse;font-size:.86rem}
.ptbl th{text-align:start;color:var(--muted);font-weight:600;font-size:.74rem;padding:8px 10px;border-bottom:1px solid var(--line)}
.ptbl td{padding:9px 10px;border-bottom:1px solid var(--line)}
.ptbl tr:hover td{background:#14201a}
.ptbl .cropdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:7px;vertical-align:middle}
.pill{font-size:.72rem;padding:3px 9px;border-radius:20px;font-weight:700;display:inline-block}
.pill.sonde{background:rgba(46,168,216,.16);color:#7cc7e6}
.pill.volume{background:rgba(201,162,75,.16);color:#dcc079}
.pill.heure{background:rgba(143,165,150,.16);color:#a9bdaf}

/* charts */
.chartwrap{background:#0e1713;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.chartwrap h3{margin:0 0 4px;font-size:.9rem}
.chartwrap .csub{color:var(--muted);font-size:.75rem;margin-bottom:10px}
.chart-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.76rem;color:var(--muted);margin-top:8px}
.chart-legend span{display:inline-flex;align-items:center;gap:6px}
.chart-legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.chart-legend i.dash{background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 7px);height:2px}
.simctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;padding:12px 14px;background:#14201a;border:1px solid var(--line);border-radius:10px}
.simctl label{font-size:.8rem;color:var(--muted)}
.simctl select,.simctl input{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#0e1713;color:var(--ink);font:inherit;font-size:.85rem}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0b120f;border:1px solid var(--line-2);color:var(--ink);padding:11px 18px;border-radius:10px;box-shadow:var(--shadow);z-index:2000;font-size:.86rem;opacity:0;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.toast.ok{border-color:var(--good)}.toast.err{border-color:var(--bad)}

/* leaflet dark theming */
.plabel{background:rgba(10,16,13,.75);border:1px solid #2b3a30;color:#e8efe6;font-size:.72rem;font-weight:600;padding:2px 7px;border-radius:6px;box-shadow:none}
.leaflet-tooltip.plabel:before{display:none}
.leaflet-control-layers,.leaflet-bar a,.leaflet-bar{background:#16201b;color:#e8efe6;border-color:#2b3a30!important}
.leaflet-control-layers{border:1px solid #2b3a30;border-radius:10px;padding:6px 8px}
.leaflet-control-layers label{color:#e8efe6}
.leaflet-bar a:hover{background:#1e2c24}
.leaflet-container{font-family:inherit}
.leaflet-draw-toolbar a{background-color:#16201b!important}
@media(max-width:900px){.inspector{width:300px}.dock{max-width:calc(100% - 336px);flex-wrap:wrap}.brand .t2{display:none}}

.prov{font-size:.8rem;cursor:help}
.prov.api{filter:grayscale(.1)}
.prov.manual{opacity:.7}
.mini-refresh{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:1px 7px;font-size:.72rem;cursor:pointer;margin-inline-start:4px}
.mini-refresh:hover{border-color:var(--water);color:var(--water)}

/* ===== onglets ===== */
.tabbar{display:flex;gap:2px;padding:0 12px;background:#111a15;border-bottom:1px solid var(--line);overflow-x:auto;z-index:15;flex:0 0 auto}
.apptab{display:inline-flex;align-items:center;gap:8px;padding:12px 15px;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);font-size:.86rem;cursor:pointer;white-space:nowrap}
.apptab svg{width:16px;height:16px;opacity:.8}
.apptab:hover{color:var(--ink)}
.apptab.on{color:var(--water);border-bottom-color:var(--water)}
.apptab.on svg{opacity:1}
#mapView{position:absolute;inset:0;z-index:1}
#tabPanel{position:absolute;inset:0;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);z-index:10;min-height:0}
.panel-topbar{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 22px;border-bottom:1px solid var(--line);background:#131d17;z-index:2}
.pt-title{font-size:1.1rem;font-weight:700}
.pt-tools{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.82rem}
.pt-tools select{padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:#0e1713;color:var(--ink);font:inherit;font-size:.85rem;min-width:160px}
.panel-scroll{position:absolute;top:56px;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:auto;padding:20px 22px 40px}
.panel-scroll::-webkit-scrollbar{width:10px}.panel-scroll::-webkit-scrollbar-thumb{background:#243329;border-radius:5px}
.loading-box{text-align:center;color:var(--muted);padding:60px 20px}
.sect{font-size:.78rem;color:var(--muted);text-transform:none;margin:22px 0 12px;letter-spacing:.02em;font-weight:600}
.src-tag{color:var(--faint);font-size:.74rem;margin:8px 0 4px}
.cache-tag{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:.78rem;padding:6px 12px;background:#131d17;border:1px solid var(--line);border-radius:20px}

/* station */
.station-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;color:var(--muted);font-size:.85rem}
.station-head b{color:var(--ink)}
.station-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.scard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.scard .sc-h{color:var(--muted);font-size:.78rem;margin-bottom:8px}
.scard .sc-v{font-size:2.1rem;font-weight:800;line-height:1;color:var(--ink)}
.scard .sc-v small{font-size:.9rem;font-weight:500;color:var(--muted);margin-inline-start:4px}
.scard .sc-v.warn{color:var(--warn)}.scard .sc-v.bad{color:var(--bad)}
.scard .sc-x{color:var(--muted);font-size:.76rem;margin-top:8px}
.scard.wind{grid-row:span 2;display:flex;flex-direction:column;align-items:center}

/* climate cards */
.clim-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
.ccard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;position:relative;overflow:hidden}
.ccard::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--cc)}

/* chrome clair */
.topbar{background:#fff!important;border-bottom:1px solid var(--line)!important}
.logo{background:radial-gradient(120% 120% at 30% 20%,#7cb342,#5a8f2c)!important;box-shadow:0 0 0 1px rgba(90,143,44,.4) inset!important}
.proj,.cache-tag{background:#f1f7e9!important}
.tbtn{background:#f1f7e9!important;color:#2c3a24!important;border-color:#d8e4c8!important}
.tbtn:hover{background:#e8f2dd!important;border-color:#7cb342!important}
.tbtn.primary{background:linear-gradient(180deg,#7cb342,#5a8f2c)!important;border-color:#5a8f2c!important;color:#fff!important}
.tbtn.ghost{background:transparent!important}
#map{background:#e9eef0!important}
/* barre d'outils de dessin : reste SOMBRE (comme le moteur partagé sur la carte) */
.drawbar{background:#16201b!important;border-color:#2b3a30!important}
.tool{color:#cdd8cb!important}
.tool:hover{background:#1e2c24!important;color:#fff!important}
.tool .tip{background:#0b120f!important;color:#e8efe6!important;border-color:#2b3a30!important}
.tool.on{background:#12303c!important;border-color:#2ea8d8!important;color:#2ea8d8!important}
/* inspecteur + modales clairs */
.inspector,.modal{background:#fff!important}
.ins-head,.modal-head{background:linear-gradient(180deg,#f6faf0,#eef7e6)!important}
.ins-tabs button.on{background:#eef7e6!important}
.modal-head .x{background:#f1f7e9!important;color:#6f7d64!important}
.modal-bg{background:rgba(30,45,25,.5)!important}
/* champs (y compris styles inline générés en JS) */
.fld input,.fld select,.simctl input,.simctl select,.pt-tools select,.depth-row input,.sim-speed,
.inspector input,.modal input{background:#fff!important;color:#2c3a24!important;border-color:#d8e4c8!important}
/* panneaux/cartes sombres -> clairs */
.chartwrap,.simctl,.cstep.big,.sp-pump,.gs-d.total,.inherit-bar,.prio .cond,.eq .ic{background:#f6faf0!important}
.tabbar,.panel-topbar,.seg,.gantt .g-head,.gd-timeline,.gantt.week .g-head,.gd-row.pump{background:#f1f7e9!important}
.seg button.on,.gantt-ctrl .seg button.on{background:#7cb342!important;color:#fff!important}
.calc-head:hover,.g-cell:hover,.gd-track:hover,.ptbl tr:hover td{background:#eef7e6!important}
.sbar,.sp-meter{background:#e3ecd6!important}
.mini-refresh{color:#6f7d64!important}
.sim-bar,.sim-panel{background:rgba(255,255,255,.94)!important}
.sim-btn{background:#f1f7e9!important;color:#2c3a24!important}
.toast{background:#2c3a24!important;color:#fff!important;border-color:#5a8f2c!important}
/* leaflet clair */
.leaflet-control-layers,.leaflet-bar a,.leaflet-bar{background:#fff!important;color:#2c3a24!important;border-color:#d8e4c8!important}
.leaflet-bar a:hover{background:#eef7e6!important}
.plabel{background:rgba(20,30,20,.72)!important;border-color:#2b3a30!important;color:#fff!important}
</style>
</head>

/* ---- ET0 FAO-56 Penman-Monteith (repris M4a) ---- */
function et0FAO56(v){
  const es=t=>0.6108*Math.exp(17.27*t/(t+237.3));
  const tmean=(v.tmax+v.tmin)/2;
  const P=101.3*Math.pow((293-0.0065*v.z)/293,5.26);
  const gamma=0.000665*P;
  const esat=(es(v.tmax)+es(v.tmin))/2;
  const ea=(es(v.tmin)*v.rhmax/100+es(v.tmax)*v.rhmin/100)/2;
  const vpd=esat-ea;
  const delta=4098*es(tmean)/Math.pow(tmean+237.3,2);
  const phi=v.lat*Math.PI/180;
  const dr=1+0.033*Math.cos(2*Math.PI*v.doy/365);
  const decl=0.409*Math.sin(2*Math.PI*v.doy/365-1.39);
  const ws=Math.acos(clamp(-Math.tan(phi)*Math.tan(decl),-1,1));
  const Ra=24*60/Math.PI*0.082*dr*(ws*Math.sin(phi)*Math.sin(decl)+Math.cos(phi)*Math.cos(decl)*Math.sin(ws));
  const Rso=(0.75+2e-5*v.z)*Ra;
  const Rns=(1-(v.albedo??0.23))*v.rs;
  const Rnl=4.903e-9*(Math.pow(v.tmax+273.16,4)+Math.pow(v.tmin+273.16,4))/2
    *(0.34-0.14*Math.sqrt(Math.max(ea,0)))*(1.35*Math.min(v.rs/Rso,1)-0.35);
  const Rn=Rns-Rnl;
  const denom=delta+gamma*(1+0.34*v.u2);
  const rad=0.408*delta*Rn/denom;
  const adv=gamma*(900/(tmean+273))*v.u2*vpd/denom;
  return {et0:Math.max(0,rad+adv),Rn,vpd,esat,ea,delta,gamma};
}

    const seas=Math.sin((doy-100)/365*2*Math.PI); // pic été
    const tmax=24+seas*13+(Math.random()*3-1.5);
    const tmin=tmax-11+(Math.random()*2-1);
    const et0=Math.max(0.8,3.5+seas*3.2+(Math.random()*0.8-0.4));
    const rain=Math.random()<0.12?Math.round(Math.random()*18):0;

/* agrège une liste de jours par période : 'week' | 'month' | 'year' */
function aggregate(days,by){
  const key=(d)=>{

    if(by==='week'){const on=new Date(dt);on.setDate(dt.getDate()-((dt.getDay()+6)%7));return on.toISOString().slice(0,10);}
    return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0'); // month
  };
  const groups={};
  days.forEach(d=>{const k=key(d);(groups[k]=groups[k]||[]).push(d);});
  return Object.keys(groups).sort().map(k=>{
    const g=groups[k];
    const sum=(f)=>g.reduce((s,x)=>s+(x[f]||0),0);
    const avg=(f)=>sum(f)/g.length;
    const rain=sum('rain'),et0=sum('et0');

      tmax:+avg('tmax').toFixed(1),tmin:+avg('tmin').toFixed(1),
      tmean:+((avg('tmax')+avg('tmin'))/2).toFixed(1),

  else if(diag.key==='below'){urgency='now';actionKey='rc_a_now';whenKey='rc_w_today';}
  else {urgency='critical';actionKey='rc_a_urgent';whenKey='rc_w_immediate';}

  const perWeek=Math.max(1,Math.round(7/intervalDays));

  const isPivot=!!p.pivot;

  // Besoin net accumulé sur l'intervalle, corrigé de l'efficience :
  const rawDoseMm=b.netDay*intervalDays/ei;

  //   sols légers 5-15 mm, sols lourds jusqu'à 25-30 mm. Pivot : plutôt 8-20 mm.
  const soilCap={sableux:15, limoneux:22, argiloLim:28, argileux:30}[p.soil]||25;

  const nPass=Math.max(1,Math.ceil(rawDoseMm/passCap));

/* Calcule un cycle d'injection pour une irrigation donnée.
   params:
     volM3   : volume d'eau de l'irrigation (m³)
     durMin  : durée de l'irrigation (min)
     targetNkgHa : cible N en kg/ha (ou P/K selon le produit)
     areaHa  : surface
     product : objet produit
     injectorLh : débit max de l'injecteur (L/h) — sécurité
   Renvoie la masse/volume de produit, la concentration, le débit d'injection.
*/
function computeInjection(o){
  const prod=o.product;
  // élément visé : on prend N par défaut, sinon P ou K si le produit n'a pas de N
  const elem = prod.n>0?'N':(prod.k>0?'K':'P');
  const grade = prod.n>0?prod.n:(prod.k>0?prod.k:prod.p); // % de l'élément visé
  const targetKgHa = o.targetKgHa || 5;   // kg/ha d'élément par irrigation
  const totalElemKg = targetKgHa * o.areaHa;
  // masse de produit commercial = élément / (grade/100)
  const productKg = grade>0 ? totalElemKg/(grade/100) : 0;
  // si liquide, convertir en litres
  const productAmount = prod.form==='liquide' ? productKg/(prod.density||1.3) : productKg;
  const unit = prod.form==='liquide'?'L':'kg';
  // concentration moyenne dans l'eau d'irrigation (g/L)
  const conc = o.volM3>0 ? (productKg*1000)/(o.volM3*1000) : 0; // g/L

  // === L'IRRIGATION EST MAÎTRE ===
  // Le temps d'injection est une FRACTION de la durée d'irrigation :
  //   pré-arrosage (démarrage à sec du réseau) + injection + rinçage final.
  const preFrac = o.preFrac ?? 0.10;   // 10% pré-arrosage
  const rinseFrac = o.rinseFrac ?? 0.10; // 10% rinçage
  const injFrac = Math.max(0.1, 1 - preFrac - rinseFrac); // ~80%
  const irrigMin = o.durMin || 0;
  const injMin = Math.round(irrigMin * injFrac);      // TOUJOURS ≤ durée irrigation
  const injStartMin = Math.round(irrigMin * preFrac); // décalage de départ
  const injEndMin = injStartMin + injMin;

  // === SOLUTION MÈRE ===
  // Le produit est dissous dans la cuve pour faire une solution mère concentrée.
  // motherConcGL = concentration de préparation (g de produit / L de solution mère).
  const motherConcGL = o.motherConcGL || 300;   // 300 g/L par défaut (typique)
  // volume de solution mère à préparer (L)
  const motherL = motherConcGL>0 ? (productKg*1000)/motherConcGL : 0;

  // === DÉBIT DOSEUR REQUIS (L/h de solution mère) ===
  // c'est ce qui se compare au débit de la pompe doseuse.
  const doserRateLh = injMin>0 ? motherL/(injMin/60) : 0;
  // débit "produit" (kg ou L/h), utile à afficher aussi
  const injRate = injMin>0 ? productAmount/(injMin/60) : 0;

  // === GARDE-FOU : capacité de la pompe doseuse (L/h) ===
  const injectorMax = o.injectorLh || null; // L/h max de la pompe doseuse
  let overCapacity=false, doserNeededLh=doserRateLh, suggestedInjectorLh=null;
  if(injectorMax && doserRateLh>injectorMax){
    overCapacity=true;
    // on suggère un injecteur au débit requis (arrondi à la dizaine supérieure)
    suggestedInjectorLh=Math.ceil(doserRateLh/10)*10;
  }

  return {
    elem, grade, targetKgHa, areaHa:o.areaHa,
    productAmount:+productAmount.toFixed(1), unit,
    conc:+conc.toFixed(2),
    motherConcGL, motherL:+motherL.toFixed(0),
    doserRateLh:+doserRateLh.toFixed(1),
    injRate:+injRate.toFixed(2), injMin, injStartMin, injEndMin,
    injFrac:+injFrac.toFixed(2),
    totalElemKg:+totalElemKg.toFixed(1),
    volM3:o.volM3, durMin:irrigMin,
    injectorMax, overCapacity, suggestedInjectorLh
  };
}

  map.on('moveend',()=>{ST.center=[map.getCenter().lat,map.getCenter().lng];ST.zoom=map.getZoom();});
  // Corrige le rendu des tuiles quand le conteneur n'a pas encore sa taille au boot
  const fixSize=()=>{try{map.invalidateSize(true);}catch(e){}};
  requestAnimationFrame(fixSize);
  setTimeout(fixSize,120);
  setTimeout(fixSize,400);
  setTimeout(fixSize,900);
  window.addEventListener('resize',fixSize);
  map.whenReady(fixSize);
}

function placePoint(e){
  const type=placingType;
  const names={well:'Puits',pump:'Motopompe',valve:'Électrovanne',probe:'Sonde',meter:'Compteur',node:'Nœud',gateway:'Passerelle',fertigation:'Fertigation'};
  const n=ST.equipment.filter(x=>x.type===type).length+1;
  const eq={id:uid(type),type,name:names[type]+' '+String(n).padStart(2,'0'),lat:e.latlng.lat,lng:e.latlng.lng,parcelId:null};
  if(type==='pump'){eq.flowM3h=40;eq.depthM=25;eq.meterM3=0;}

  if(type==='probe'){eq.depths=[{cm:20,label:'Zone racinaire',moisture:null},{cm:40,label:'Front d\'humidité',moisture:null},{cm:60,label:'Drainage / perte',moisture:null}];eq.nodeId=null;}
  if(type==='meter'){eq.meterM3=0;eq.pumpId=defaultPumpId();eq.diameter=50;}
  if(type==='node'){eq.gatewayId=null;eq.battery=100;eq.solar=true;eq.rssi=-95;}
  if(type==='gateway'){eq.channels=8;eq.backhaul='4G';eq.rangeKm=5;}
  if(type==='fertigation'){eq.pumpId=defaultPumpId();eq.tankL=2000;eq.injectorLh=500;eq.motherConcGL=300;eq.cycles=[];}
  ST.equipment.push(eq);
  addEquipmentMarker(eq);
  selection={kind:'equipment',id:eq.id}; renderInspector();
  selectTool('select');
}
function defaultPumpId(){const p=ST.equipment.find(e=>e.type==='pump');return p?p.id:null;}

/* handle finished draw shapes */
function wireDraw(){
  map.on(L.Draw.Event.CREATED,(e)=>{
    const layer=e.layer;
    if(activeTool==='parcel'||e.layerType==='polygon'){
      const coords=layer.getLatLngs()[0].map(ll=>[ll.lat,ll.lng]);
      const area=+(L.GeometryUtil?L.GeometryUtil.geodesicArea(layer.getLatLngs()[0])/10000:polyAreaHa(coords)).toFixed(2);
      const n=ST.parcels.length+1;
      const p={id:uid('P'),name:'Parcelle '+String(n).padStart(2,'0'),crop:'olivier',stage:'mid',
        soil:'argiloLim',area:area||1,rootDepth:60,ei:0.9,p:0.5,peff:0.8,
        moisture:null,coords,center:centroid(coords)};
      ST.parcels.push(p); addParcelLayer(p);
      selection={kind:'parcel',id:p.id}; insTab='fiche'; renderInspector();
      maybeAutoFetch(p);
      selectTool('select');
    }else if(activeTool==='pivot'||e.layerType==='circle'){
      const c=layer.getLatLng(), r=layer.getRadius();
      const area=+(Math.PI*r*r/10000).toFixed(2);
      const n=ST.parcels.length+1;
      const p={id:uid('PIV'),name:'Pivot '+String(n).padStart(2,'0'),crop:'ble',stage:'mid',
        soil:'limoneux',area:area||1,rootDepth:60,ei:0.85,p:0.5,peff:0.8,moisture:null,
        pivot:{lat:c.lat,lng:c.lng,radius:r},center:[c.lat,c.lng]};
      ST.parcels.push(p); addPivotLayer(p);
      selection={kind:'parcel',id:p.id}; insTab='fiche'; renderInspector();
      maybeAutoFetch(p);
      selectTool('select');
    }
  });
}
function polyAreaHa(coords){ // fallback planar approx (small areas)
  let a=0;for(let i=0,j=coords.length-1;i<coords.length;j=i++){
    const xi=coords[i][1]*Math.cos(coords[i][0]*Math.PI/180)*111320, yi=coords[i][0]*110540;
    const xj=coords[j][1]*Math.cos(coords[j][0]*Math.PI/180)*111320, yj=coords[j][0]*110540;
    a+=(xj*yi-xi*yj);}
  return Math.abs(a/2)/10000;
}
function centroid(coords){let x=0,y=0;coords.forEach(c=>{x+=c[0];y+=c[1];});return [x/coords.length,y/coords.length];}

}
function addPivotLayer(p){

  const grp=L.featureGroup().addTo(drawnItems);
  L.circle([p.pivot.lat,p.pivot.lng],{radius:p.pivot.radius,color,weight:2,dashArray:'5 5',fillColor:color,fillOpacity:.14}).addTo(grp);
  L.circleMarker([p.pivot.lat,p.pivot.lng],{radius:4,color,fillColor:color,fillOpacity:1}).addTo(grp);

const EQ_COLORS={well:'#5fb15a',pump:'#e08a2b',valve:'#2ea8d8',probe:'#c9a24b',meter:'#2ea8d8',node:'#5fb15a',gateway:'#9b6dd8',fertigation:'#3fb8a8'};
function addEquipmentMarker(eq){
  const bg=EQ_COLORS[eq.type]||'#8fa596';

function rebuildLayers(){
  drawnItems.clearLayers();layerIndex={};window.layerIndex=layerIndex;

function refreshParcelColor(p){

/* ---------- MÉTÉO (Open-Meteo, sans clé) + fallback simulé ---------- */
/* Récupère la météo à une position donnée (générique, réutilisable) */
async function fetchMeteoAt(lat,lng){
  const url='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lng
    +'&current=temperature_2m,relative_humidity_2m,wind_speed_10m,wind_direction_10m,surface_pressure,weather_code'
    +'&daily=temperature_2m_max,temperature_2m_min,et0_fao_evapotranspiration,precipitation_sum,'
    +'relative_humidity_2m_max,relative_humidity_2m_min,wind_speed_10m_max,shortwave_radiation_sum'
    +'&forecast_days=7&timezone=auto';
  try{
    const r=await fetch(url); if(!r.ok) throw new Error('http');
    const j=await r.json();
    const daily=j.daily.time.map((d,i)=>({
      date:d, tmax:j.daily.temperature_2m_max[i], tmin:j.daily.temperature_2m_min[i],
      et0:j.daily.et0_fao_evapotranspiration[i], rain:j.daily.precipitation_sum[i],
      rhmax:j.daily.relative_humidity_2m_max[i], rhmin:j.daily.relative_humidity_2m_min[i],
      wind:j.daily.wind_speed_10m_max[i]/3.6, rs:j.daily.shortwave_radiation_sum[i]
    }));
    return {source:'Open-Meteo',current:{temp:j.current.temperature_2m,rh:j.current.relative_humidity_2m,
      wind:j.current.wind_speed_10m,dir:j.current.wind_direction_10m,pressure:j.current.surface_pressure,
      code:j.current.weather_code},daily};
  }catch(e){ return simulatedMeteo(); }
}
async function loadMeteo(){
  const {lat,lng}=ST.location;
  ST.meteo=await fetchMeteoAt(lat,lng);
  renderMeteo();
}
/* Météo propre à une parcelle (basée sur sa position) — cache dans p._meteo */
async function loadParcelMeteo(p, showToast){
  const c=p.center||(p.pivot?[p.pivot.lat,p.pivot.lng]:null);
  if(!c)return;
  if(showToast)toast(window.t?window.t('meteo_loading'):'Météo parcelle…');
  p._meteo=await fetchMeteoAt(c[0],c[1]);
  saveLocal();
  // re-render partout où cette parcelle est affichée
  if(selection&&selection.id===p.id)renderInspector();
  const fp=(typeof focusParcel==='function')?focusParcel():null;
  if(typeof currentTab!=='undefined'&&currentTab!=='map'&&fp&&fp.id===p.id){
    if(currentTab==='climate')climateData=null;
    if(currentTab==='station'&&window.resetStationState)window.resetStationState();
    renderTabPanel();
  }
  if(showToast&&p._meteo)toast((p._meteo.source==='Open-Meteo'?'Météo parcelle actualisée':'Météo indisponible — simulée'));
}
window.refetchParcelMeteo=(id)=>{const p=parcelById(id);if(p)loadParcelMeteo(p,true);};
window.loadParcelMeteo=loadParcelMeteo;
// charge la météo d'une parcelle si elle manque (auto, sans toast)
window.ensureParcelMeteo=(p)=>{if(p&&!p._meteo&&(p.center||p.pivot)){loadParcelMeteo(p,false);}};
/* météo effective d'une parcelle : la sienne, sinon celle du domaine */
function parcelMeteo(p){return (p&&p._meteo)?p._meteo:ST.meteo;}
function simulatedMeteo(){
  const daily=[];const today=new Date();
  for(let i=0;i<7;i++){
    const d=new Date(today);d.setDate(d.getDate()+i);
    const tmax=30+Math.round(Math.sin(i/2)*4), tmin=tmax-11;
    daily.push({date:d.toISOString().slice(0,10),tmax,tmin,
      et0:+(6+Math.sin(i/2)*1.2).toFixed(1),rain:i===3?4:0,rhmax:72,rhmin:26,wind:3.5,rs:26});
  }
  return {source:'Simulé (hors-ligne)',current:{temp:31,rh:45,wind:14,dir:315,pressure:1013,code:0},daily};
}
const WCODE=(c)=>{if(c==0)return window.t('wc_clear');if(c<3)return window.t('wc_fair');if(c<50)return window.t('wc_cloudy');if(c<70)return window.t('wc_rain');if(c<80)return window.t('wc_showers');return window.t('wc_storms');};
function renderMeteo(){
  const m=ST.meteo;if(!m)return;
  const host=$('#meteo');
  const days=m.daily.slice(0,5).map(d=>{
    const dn=new Date(d.date).toLocaleDateString('fr-FR',{weekday:'short'});
    return '<div class="d">'+dn+'<div class="dv tabnum">'+Math.round(d.tmax)+'°</div><div class="et0v">'+fmt(d.et0,1)+'</div></div>';
  }).join('');
  host.innerHTML=
    '<div class="now"><div><div class="temp tabnum">'+Math.round(m.current.temp)+'°</div>'
    +'<div class="loc"><b>'+ST.location.name+'</b>'+WCODE(m.current.code)+' · '+window.t('wind_label')+' '+Math.round(m.current.wind)+' km/h</div></div></div>'
    +'<div><div class="days">'+days+'</div><div class="src">ET₀ mm/j · '+m.source+' <button class="mini-refresh" onclick="refreshMeteo()" title="Actualiser">↻</button></div></div>';
}
/* ET0 du jour — pour une parcelle (sa météo) ou le domaine */
function et0Today(p){const m=p?parcelMeteo(p):ST.meteo;return m&&m.daily[0]?m.daily[0].et0:6.5;}
function et0Series(n,p){const m=p?parcelMeteo(p):ST.meteo;const d=m?m.daily:[];const out=[];for(let i=0;i<n;i++)out.push(d[i%Math.max(1,d.length)]?d[i%d.length].et0:6.5);return out;}

  else{renderEquipmentInspector(host);}

  return '<div class="ins-head"><div><div class="h-t">Aucune sélection</div><div class="h-s">Dessinez ou sélectionnez un élément</div></div></div>'
   +'<div class="ins-body"><div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5l7-2 9 4-2 14-12-1z"/></svg>'
   +'Utilisez la barre d’outils à gauche pour dessiner une parcelle, un pivot, ou placer un puits, une pompe, une électrovanne ou une sonde.<br><br>Puis cliquez sur un élément pour voir son bilan hydrique et le configurer.</div></div>';
}

function parcelById(id){return ST.parcels.find(p=>p.id===id);}
function eqById(id){return ST.equipment.find(e=>e.id===id);}
function parcelEquipment(pid){return ST.equipment.filter(e=>e.parcelId===pid);}

// humidité "zone racinaire" (20 cm) d'une sonde rattachée à la parcelle, si mesurée
function rootMoistureFromProbe(pid){
  const probes=ST.equipment.filter(e=>e.type==='probe'&&e.parcelId===pid&&e.depths);
  for(const pr of probes){
    const d20=pr.depths.find(d=>d.cm===20)||pr.depths[0];
    if(d20&&d20.moisture!=null)return d20.moisture;
  }
  return null;
}
function computeParcelBilan(p){
  const m=parcelMeteo(p);
  const et0=et0Today(p);
  const rain=m&&m.daily[0]?m.daily[0].rain:0;
  const probeMoist=rootMoistureFromProbe(p.id);
  const moist=(p.moisture!=null)?p.moisture:probeMoist;
  const pp={...p,rain,moisture:moist,ecw:p.ecw,ece:p.ece};
  const b=A.waterBalance(pp,et0,7);
  if(moist==null)p._moistShown=b.sr+ (b.confort-b.sr)*0.4; else p._moistShown=moist;
  const diag=A.probeDiag(p._moistShown,b.cc,b.pf,b.sr,b.confort);
  return {b,diag,et0};
}

function renderParcelInspector(host){
  const p=parcelById(selection.id);if(!p){selection=null;return renderInspector();}

  const pct=(x)=>A.clamp((x-b.pf)/(b.cc-b.pf)*100,0,100);

  let head='<div class="ins-head"><div><div class="h-t">'+p.name+'</div>'

      +'<div><b>'+diag.txt+'</b>Humidité '+fmt(moist,1)+' % vol.'+(doseMm>0?' · dose conseillée '+fmt(doseMm,0)+' mm ('+fmt(doseM3,0)+' m³)':'')+'</div></div>';
    body+='<div class="gauge"><div class="track"><div class="fill" style="width:'+pct(moist)+'%"></div>'
      +'<div class="mk pf" style="left:0%"></div><div class="mk sr" style="left:'+pct(b.sr)+'%"></div><div class="mk cc" style="left:100%"></div>'
      +'<div class="cur" style="left:'+pct(moist)+'%"></div></div>'
      +'<div class="lbls"><span>PF '+fmt(b.pf,0)+'%</span><span>Seuil '+fmt(b.sr,0)+'%</span><span>CC '+fmt(b.cc,0)+'%</span></div></div>';
    body+=stat('ET₀ aujourd’hui',fmt(et0,1),'mm/j','water')

      +stat('ETc = ET₀ × Kc',fmt(b.etc,1),'mm/j')

      +(b.lr>0?stat('↳ dont lessivage sels (+'+Math.round(b.lr*100)+'%)',fmt(b.gross-b.grossBase,0),'mm','water'):'')
      +stat('Volume brut parcelle',fmt(b.volM3,0),'m³','water')
      +stat('Intervalle max',fmt(b.interval,1),'jours');
    body+='<div class="btn-row"><button class="tbtn primary" onclick="openSimForParcel(\''+p.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>Simuler & graphiques</button></div>';

    body+='<div class="fld"><label>Produit d’injection</label><select onchange="setParcel(\''+p.id+'\',\'fertil\',this.value)">'
      +fertOptions(p.fertil)+'</select></div>';
  }
  else if(insTab==='sonde'){

    body+='<div class="section-t"><span>Sondes de sol</span><span>'+probes.length+'</span></div>';
    if(!probes.length)body+='<div class="empty" style="padding:20px">Aucune sonde sur cette parcelle.<br>Les valeurs affichées dans le bilan sont estimées à partir du bilan hydrique.</div>';

      const dcol=['#5fb15a','#4a9fd8','#d1584e'];

            +'<span class="v tabnum" style="font-weight:700">'+mv+'</span><span class="depth-u">% vol.</span></div>';

    }

    const prov=(key,apiOk)=> apiOk?(src[key]==='manual'?' <span class="prov manual" title="saisi à la main">✎</span>':(src[key]==='api'?' <span class="prov api" title="depuis SoilGrids">📡</span>':'')):'';
    // --- météo propre à la parcelle ---
    const pm=p._meteo;
    body+='<div class="section-t"><span>'+(window.t?window.t('parcel_weather'):'Météo parcelle')+'</span>'
      +'<button class="mini-refresh" onclick="refetchParcelMeteo(\''+p.id+'\')" title="Actualiser la météo">↻</button></div>';
    if(pm){
      body+=stat((window.t?window.t('et0_today'):'ET₀ aujourd’hui'),fmt(pm.daily[0].et0,1),'mm/j','water');
      body+=stat((window.t?window.t('wm_temp'):'Température'),fmt(pm.current.temp,0),'°C');
      body+='<div class="hint" style="margin-bottom:10px">'+(pm.source==='Open-Meteo'?'📡 Open-Meteo · '+fmt(p.center?p.center[0]:0,3)+', '+fmt(p.center?p.center[1]:0,3):'Simulé (hors-ligne)')+'</div>';
    }else{
      body+='<div class="hint" style="margin-bottom:10px">Météo non chargée — cliquez ↻ pour récupérer les données à la position de la parcelle.</div>';
    }
    body+='<div class="section-t"><span>Sol <span id="soilBadge" style="color:var(--water)"></span></span>'
      +'<button class="mini-refresh" onclick="refetchSoil(\''+p.id+'\')" title="Re-récupérer le sol">↻ sol</button></div>';
    body+=fldSelect(window.t('f_soiltype')+prov('soil',true),p.soil,Object.keys(A.SOILS).map(k=>[k,A.SOILS[k].label]),v=>setParcelManual(p.id,'soil',v));
    const ccV=p.cc!=null?p.cc:A.SOILS[p.soil].cc, pfV=p.pf!=null?p.pf:A.SOILS[p.soil].pf;
    body+='<div class="fld"><div class="row">'
      +miniNumP(window.t('f_ccfield')+prov('cc',true),ccV,'cc',p.id,0.5)
      +miniNumP(window.t('f_pffield')+prov('pf',true),pfV,'pf',p.id,0.5)+'</div>';
    if(p.texture)body+='<div class="hint">Texture SoilGrids : argile '+p.texture.clay+'% · limon '+p.texture.silt+'% · sable '+p.texture.sand+'%</div>';
    body+='</div>';
    body+='<div class="section-t">Culture</div>';
    body+=cropSelectField(window.t('f_crop'),p.crop,v=>setParcel(p.id,'crop',v));
    body+=fldSelect(window.t('f_stage'),p.stage,Object.keys(STAGES).map(k=>[k,STAGES_L()[k]]),v=>setParcel(p.id,'stage',v));
    body+='<div class="fld"><div class="row">'
      +miniNum(window.t('f_area'),p.area,'area',p.id,0.01)
      +miniNum(window.t('f_rootdepth'),p.rootDepth,'rootDepth',p.id,5)+'</div></div>';
    body+='<div class="section-t">Paramètres d’irrigation</div>';
    body+='<div class="fld"><div class="row">'
      +miniNum(window.t('f_ei'),p.ei,'ei',p.id,0.05)
      +miniNum(window.t('f_p'),p.p,'p',p.id,0.05)+'</div></div>';
    body+='<div class="fld"><div class="row">'
      +miniNum(window.t('f_peff'),p.peff,'peff',p.id,0.05)
      +miniNumP('ECw eau (dS/m)',p.ecw!=null?p.ecw:'','ecw',p.id,0.1)+'</div>'
      +'<div class="hint">ECw = salinité de l’eau. Renseignez-la pour majorer le volume (lessivage des sels).</div></div>';
    if(p.ecw!=null)body+='<div class="fld">'+miniNumP('Seuil ECe culture (dS/m)',p.ece!=null?p.ece:2.7,'ece',p.id,0.1)+'</div>';
    body+='<div class="section-t">'+window.t('f_identity')+'</div>';
    body+='<div class="fld"><label>'+window.t('f_name')+'</label><input value="'+p.name.replace(/"/g,'&quot;')+'" onchange="setParcel(\''+p.id+'\',\'name\',this.value)"></div>';
    body+='<div class="btn-row"><button class="tbtn ghost" style="color:var(--bad);border-color:#4a2b28" onclick="deleteParcel(\''+p.id+'\')">'+window.t('f_delete')+'</button></div>';
  }
  body+='</div>';
  host.innerHTML=head+tabs+body;
}
function tabBtn(id,label){return '<button class="'+(insTab===id?'on':'')+'" onclick="setInsTab(\''+id+'\')">'+label+'</button>';}
function setInsTab(t){insTab=t;renderInspector();}
function stat(k,v,u,cls){return '<div class="stat"><span class="k">'+k+'</span><span class="v '+(cls||'')+' tabnum">'+v+(u?'<small>'+u+'</small>':'')+'</span></div>';}
function fldSelect(label,val,opts,onch){
  const id=uid('sel');window['_h_'+id]=onch;
  return '<div class="fld"><label>'+label+'</label><select onchange="window[\'_h_'+id+'\'](this.value)">'
    +opts.map(([v,l])=>'<option value="'+v+'"'+(v==val?' selected':'')+'>'+l+'</option>').join('')+'</select></div>';
}
/* Sélecteur Culture groupé par famille (<optgroup>), i18n-aware */
function cropSelectField(label,val,onch){
  const id=uid('sel');window['_h_'+id]=onch;
  const lang=(window.I18N&&window.I18N.getLang)?window.I18N.getLang():'fr';
  let opts='';
  Object.keys(CROP_GROUPS).forEach(g=>{
    const ks=Object.keys(CROPS).filter(k=>CROPS[k].g===g);
    if(!ks.length)return;
    const gl=CROP_GROUPS[g][lang]||CROP_GROUPS[g].fr;
    opts+='<optgroup label="'+gl+'">'
      +ks.map(k=>'<option value="'+k+'"'+(k==val?' selected':'')+'>'+CROPS[k].label+'</option>').join('')
      +'</optgroup>';
  });
  return '<div class="fld"><label>'+label+'</label><select onchange="window[\'_h_'+id+'\'](this.value)">'+opts+'</select></div>';
}
function miniNum(label,val,key,pid,step){
  return '<div><label style="color:var(--muted);font-size:.72rem;display:block;margin-bottom:5px">'+label+'</label>'
    +'<input type="number" step="'+step+'" value="'+val+'" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:#0e1713;color:var(--ink)" onchange="setParcel(\''+pid+'\',\''+key+'\',parseFloat(this.value))"></div>';
}
function eqRow(eq){
  const map_={well:['well','Puits'],pump:['pump','Motopompe'],valve:['water','Électrovanne'],probe:['soil','Sonde'],meter:['water','Compteur'],node:['well','Nœud'],gateway:['water','Passerelle'],fertigation:['soil','Fertigation']};
  const [cls,lbl]=map_[eq.type]||['soil',eq.type];
  let d=lbl;
  if(eq.type==='pump')d='Débit '+eq.flowM3h+' m³/h · compteur '+fmt(eq.meterM3,0)+' m³';
  if(eq.type==='valve')d='Vanne · compteur '+fmt(eq.meterM3,0)+' m³';
  if(eq.type==='probe')d='3 profondeurs · 20/40/60 cm';
  if(eq.type==='meter')d='Index '+fmt(eq.meterM3,0)+' m³ · Ø'+eq.diameter+' mm';
  if(eq.type==='node')d='LoRa · batterie '+fmt(eq.battery,0)+'%';
  if(eq.type==='gateway')d=eq.channels+' canaux · '+eq.backhaul;
  if(eq.type==='fertigation')d=(eq.cycles?eq.cycles.length:0)+' cycle(s) · cuve '+eq.tankL+' L';
  if(eq.type==='well')d='Puits '+eq.depthM+' m';
  const st=eq.state?('<span class="st '+(eq.state==='on'?'on':'off')+'">'+(eq.state==='on'?'ouverte':'fermée')+'</span>'):'';
  return '<div class="eq" onclick="selectEq(\''+eq.id+'\')"><div class="ic '+cls+'">'+iconSVG(eq.type)
    +'</div><div class="m"><div class="n">'+eq.name+'</div><div class="d">'+d+'</div></div>'+st+'</div>';
}
function fertOptions(sel){
  const list=['Aucun','Nitrate d’ammonium (NH₄NO₃)','MAP (12-61-0)','Sulfate de potassium (0-0-50)','Acide phosphorique','Nitrate de calcium','Nitrate de potassium (13-0-46)','Chélate de fer (Fe-EDDHA)'];
  return list.map(f=>'<option'+(sel===f?' selected':'')+'>'+f+'</option>').join('');
}
window.setInsTab=setInsTab;
window.selectEq=(id)=>{selection={kind:'equipment',id};renderInspector();};
window.setParcel=(id,k,v)=>{const p=parcelById(id);if(!p)return;p[k]=v;
  if(k==='crop'||k==='name')refreshParcelColor(p);
  if(['crop','stage','soil','area','rootDepth','ei','p','peff','ecw','ece','cc','pf'].includes(k))renderInspector();
  saveLocal();};
window.setParcelManual=(id,k,v)=>{const p=parcelById(id);if(!p)return;
  p._src=p._src||{};p._src[k]='manual';p[k]=v;
  if(k==='soil'){/* si on change le type de sol à la main, on repart de ses CC/PF défaut */
    p.cc=A.SOILS[v].cc;p.pf=A.SOILS[v].pf;p._src.cc='default';p._src.pf='default';refreshParcelColor(p);}
  renderInspector();saveLocal();};
function miniNumP(label,val,key,pid,step){
  return '<div><label style="color:var(--muted);font-size:.72rem;display:block;margin-bottom:5px">'+label+'</label>'
    +'<input type="number" step="'+step+'" value="'+val+'" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:#0e1713;color:var(--ink)" onchange="setParcelManual(\''+pid+'\',\''+key+'\',this.value===\'\'?null:parseFloat(this.value))"></div>';
}
window.deleteParcel=(id)=>{if(!confirm('Supprimer cette parcelle ?'))return;
  ST.parcels=ST.parcels.filter(p=>p.id!==id);
  ST.equipment.forEach(e=>{if(e.parcelId===id)e.parcelId=null;});
  rebuildLayers();selection=null;renderInspector();saveLocal();toast(window.t('t_parcel_del'));};

/* ---------- EQUIPMENT INSPECTOR (incl. valve stop-config) ---------- */
function renderEquipmentInspector(host){
  const eq=eqById(selection.id);if(!eq){selection=null;return renderInspector();}
  const titles={well:window.t('eqt_well'),pump:window.t('eqt_pump'),valve:window.t('eqt_valve'),probe:window.t('eqt_probe'),meter:window.t('eqt_meter'),node:window.t('eqt_node'),gateway:window.t('eqt_gateway'),fertigation:window.t('eqt_fertig')};
  const parcelOpts=[['','— aucune —']].concat(ST.parcels.map(p=>[p.id,p.name]));
  let head='<div class="ins-head"><div><div class="h-t">'+eq.name+'</div>'
    +'<div class="h-s">'+titles[eq.type]+'</div></div>'
    +(eq.state?'<span class="chip '+(eq.state==='on'?'olivier':'')+'" style="'+(eq.state!=='on'?'background:rgba(143,165,150,.14);color:var(--muted);border-color:var(--line)':'')+'">'+(eq.state==='on'?'Ouverte':'Fermée')+'</span>':'')+'</div>';
  let body='<div class="ins-body">';
  body+='<div class="fld"><label>'+window.t('eq_name')+'</label><input value="'+eq.name.replace(/"/g,'&quot;')+'" onchange="setEq(\''+eq.id+'\',\'name\',this.value)"></div>';
  body+=fldSelect(window.t('eq_parcel'),eq.parcelId||'',parcelOpts,v=>setEq(eq.id,'parcelId',v||null));

  if(eq.type==='pump'){
    body+='<div class="fld"><div class="row">'+miniEq(window.t('eq_flow'),eq.flowM3h,'flowM3h',eq.id,1)+miniEq(window.t('eq_depth_m'),eq.depthM,'depthM',eq.id,1)+'</div></div>';
    body+=stat(window.t('eq_master_meter'),fmt(eq.meterM3,0),'m³','water');
    const valves=ST.equipment.filter(e=>e.type==='valve'&&e.pumpId===eq.id);
    body+='<div class="section-t"><span>'+window.t('eq_valves_fed')+'</span><span>'+valves.length+'</span></div>';
    body+='<div class="eq-list">'+(valves.map(eqRow).join('')||'<div class="hint">'+window.t('eq_no_valve')+'</div>')+'</div>';
  }
  else if(eq.type==='well'){
    body+='<div class="fld"><div class="row">'+miniEq(window.t('eq_depth_m'),eq.depthM,'depthM',eq.id,1)+miniEq(window.t('eq_static'),eq.staticLevel,'staticLevel',eq.id,1)+'</div></div>';
  }
  else if(eq.type==='probe'){
    // migration douce : ancienne sonde mono-profondeur → 3 profondeurs
    if(!eq.depths){eq.depths=[{cm:20,label:'Zone racinaire',moisture:eq.moisture??null},{cm:40,label:'Front d\'humidité',moisture:null},{cm:60,label:'Drainage / perte',moisture:null}];}
    const nodes=[['','— aucun —']].concat(ST.equipment.filter(e=>e.type==='node').map(n=>[n.id,n.name]));
    body+=fldSelect(window.t('eq_node_link'),eq.nodeId||'',nodes,v=>setEq(eq.id,'nodeId',v||null));
    body+='<div class="section-t">'+window.t('eq_depth_meas')+'</div>';
    body+='<div class="depths">';
    const dcol=['#5fb15a','#4a9fd8','#d1584e'];
    eq.depths.forEach((d,i)=>{
      body+='<div class="depth-row"><span class="depth-dot" style="background:'+dcol[i]+'"></span>'
        +'<div class="depth-info"><b>'+d.cm+' cm</b><small>'+window.t(d.cm===20?'d_root':d.cm===40?'d_front':'d_drain')+'</small></div>'
        +'<input type="number" step="0.5" placeholder="auto" value="'+(d.moisture!=null?d.moisture:'')+'" '
        +'onchange="setDepth(\''+eq.id+'\','+i+',this.value)"><span class="depth-u">% vol.</span></div>';
    });
    body+='</div>';
    body+='<div class="hint">'+window.t('eq_probe_note')+'</div>';
  }
  else if(eq.type==='valve'){
    const pumps=[['','— aucune —']].concat(ST.equipment.filter(e=>e.type==='pump').map(p=>[p.id,p.name]));
    body+=fldSelect(window.t('eq_pump_valve'),eq.pumpId||'',pumps,v=>setEq(eq.id,'pumpId',v||null));
    body+=stat(window.t('eq_subcounter'),fmt(eq.meterM3,0),'m³','water');
    body+=renderValveStopConfig(eq);
  }
  else if(eq.type==='meter'){
    const pumps=[['','— aucune —']].concat(ST.equipment.filter(e=>e.type==='pump').map(p=>[p.id,p.name]));
    body+=fldSelect(window.t('eq_pump_line'),eq.pumpId||'',pumps,v=>setEq(eq.id,'pumpId',v||null));
    body+='<div class="fld">'+miniEq(window.t('eq_diameter'),eq.diameter,'diameter',eq.id,5)+'</div>';
    body+=stat(window.t('eq_meter_index'),fmt(eq.meterM3,0),'m³','water');
    body+='<div class="hint">'+window.t('eq_meter_note')+'</div>';
  }
  else if(eq.type==='node'){
    const gws=[['','— aucune —']].concat(ST.equipment.filter(e=>e.type==='gateway').map(g=>[g.id,g.name]));
    body+=fldSelect(window.t('eq_gw_link'),eq.gatewayId||'',gws,v=>setEq(eq.id,'gatewayId',v||null));
    body+='<div class="section-t">'+window.t('eq_node_state')+'</div>';
    body+=stat(window.t('eq_battery'),fmt(eq.battery,0),'%',eq.battery<20?'':'water');
    body+=stat(window.t('eq_rssi'),fmt(eq.rssi,0),'dBm');
    body+='<div class="fld" style="margin-top:8px"><label>'+window.t('eq_solar')+'</label>'
      +'<select onchange="setEq(\''+eq.id+'\',\'solar\',this.value===\'1\')"><option value="1"'+(eq.solar?' selected':'')+'>'+window.t('eq_solar_panel')+'</option><option value="0"'+(!eq.solar?' selected':'')+'>'+window.t('eq_battery_only')+'</option></select></div>';
    const probes=ST.equipment.filter(e=>e.type==='probe'&&e.nodeId===eq.id);
    body+='<div class="section-t"><span>'+window.t('eq_probes_linked')+'</span><span>'+probes.length+'</span></div>';
    body+='<div class="eq-list">'+(probes.map(eqRow).join('')||'<div class="hint">'+window.t('eq_no_probe')+'</div>')+'</div>';
    body+='<div class="hint">'+window.t('eq_node_note')+'</div>';
  }
  else if(eq.type==='gateway'){
    body+='<div class="fld"><div class="row">'+miniEq(window.t('eq_channels'),eq.channels,'channels',eq.id,1)+miniEq(window.t('eq_range'),eq.rangeKm,'rangeKm',eq.id,0.5)+'</div></div>';
    body+='<div class="fld"><label>'+window.t('eq_backhaul')+'</label>'
      +'<select onchange="setEq(\''+eq.id+'\',\'backhaul\',this.value)">'
      +['4G','Fibre','Ethernet','Wifi'].map(b=>'<option'+(eq.backhaul===b?' selected':'')+'>'+b+'</option>').join('')+'</select></div>';
    const nodes=ST.equipment.filter(e=>e.type==='node'&&e.gatewayId===eq.id);
    body+='<div class="section-t"><span>'+window.t('eq_nodes_conn')+'</span><span>'+nodes.length+'</span></div>';
    body+='<div class="eq-list">'+(nodes.map(eqRow).join('')||'<div class="hint">'+window.t('eq_no_node')+'</div>')+'</div>';
    body+='<div class="hint">'+window.t('eq_gw_note')+' ('+eq.backhaul+').</div>';
  }
  else if(eq.type==='fertigation'){
    if(!eq.cycles)eq.cycles=[];
    const pumps=[['','— aucune —']].concat(ST.equipment.filter(e=>e.type==='pump').map(p=>[p.id,p.name]));
    body+=fldSelect(window.t('eq_fert_pump'),eq.pumpId||'',pumps,v=>setEq(eq.id,'pumpId',v||null));
    body+='<div class="fld"><div class="row">'+miniEq(window.t('eq_tank'),eq.tankL,'tankL',eq.id,50)+miniEq(window.t('eq_doser'),eq.injectorLh,'injectorLh',eq.id,10)+'</div></div>';
    body+='<div class="fld">'+miniEq(window.t('eq_mother'),eq.motherConcGL||300,'motherConcGL',eq.id,25)+'<div class="hint">'+window.t('eq_mother_note')+'</div></div>';
    body+='<div class="section-t"><span>'+window.t('eq_inj_cycles')+'</span><button class="mini-refresh" onclick="addFertCycle(\''+eq.id+'\')">+ ajouter</button></div>';
    if(!eq.cycles.length){
      body+='<div class="empty" style="padding:18px">'+window.t('eq_no_cycle')+'</div>';
    }else{
      body+='<div class="fert-cycles">';
      eq.cycles.forEach((cy,ci)=>{
        const prod=window.FERTIGATION.productById(cy.productId)||window.FERTIGATION.PRODUCTS[0];
        const parcel=ST.parcels.find(p=>p.id===cy.parcelId);
        body+='<div class="fert-cy" style="--fc:'+prod.color+'">'
          +'<div class="fc-top"><span class="fc-dot" style="background:'+prod.color+'"></span>'
          +'<b>'+prod.name+'</b><button class="fc-del" onclick="delFertCycle(\''+eq.id+'\','+ci+')">✕</button></div>';
        // produit
        body+='<div class="fld" style="margin:6px 0"><label>'+window.t('eq_product')+'</label><select onchange="setFertCycle(\''+eq.id+'\','+ci+',\'productId\',this.value)">'
          +window.FERTIGATION.PRODUCTS.map(p=>'<option value="'+p.id+'"'+(p.id===cy.productId?' selected':'')+'>'+p.name+'</option>').join('')+'</select></div>';
        // parcelle cible
        const pOpts=ST.parcels.map(p=>'<option value="'+p.id+'"'+(p.id===cy.parcelId?' selected':'')+'>'+p.name+'</option>').join('');
        body+='<div class="fld" style="margin:6px 0"><label>'+window.t('eq_target_parcel')+'</label><select onchange="setFertCycle(\''+eq.id+'\','+ci+',\'parcelId\',this.value)">'+pOpts+'</select></div>';
        // cible kg/ha
        body+='<div class="fld" style="margin:6px 0"><label>Dose élément ('+(prod.n>0?'N':prod.k>0?'K':'P')+') kg/ha par irrigation</label>'
          +'<input type="number" step="0.5" value="'+(cy.targetKgHa||5)+'" onchange="setFertCycle(\''+eq.id+'\','+ci+',\'targetKgHa\',parseFloat(this.value))"></div>';
        // calcul en direct
        if(parcel){
          const rec=recoForParcel(parcel);
          const station=eqById(eq.id);
          const inj=window.FERTIGATION.computeInjection({volM3:rec?rec.doseM3:100,durMin:rec?rec.durH*60:120,targetKgHa:cy.targetKgHa||5,areaHa:parcel.area||1,product:prod,injectorLh:station?station.injectorLh:null,motherConcGL:station?station.motherConcGL:300});
          const irrigMin=rec?Math.round(rec.durH*60):120;
          body+='<div class="fc-calc">'
            +fcRow(window.t('fc_irrig_master'),fmt(irrigMin,0)+' min')
            +fcRow(window.t('fc_inj_window'),inj.injStartMin+'–'+inj.injEndMin+' min ('+inj.injMin+' min)')
            +fcRow(window.t('fc_product_prep'),fmt(inj.productAmount,0)+' '+inj.unit)
            +fcRow(window.t('fc_mother_sol'),fmt(inj.motherL,0)+' L à '+inj.motherConcGL+' g/L')
            +fcRow(window.t('fc_doser_req'),fmt(inj.doserRateLh,0)+' L/h')
            +fcRow(window.t('fc_conc_irrig'),inj.conc+' g/L')
            +fcRow(window.t('fc_ec'),window.FERTIGATION.estimateEC(inj.conc,parcel.ecw||0.5)+' dS/m')
            +'</div>';
          // Information de dimensionnement (neutre) — les gros débits sont normaux sur grandes surfaces
          if(inj.overCapacity){
            const nInj=Math.ceil(inj.doserRateLh/inj.injectorMax);
            body+='<div class="fc-info">Dimensionnement : ce cycle demande '+fmt(inj.doserRateLh,0)+' L/h de solution mère. '
              +'Votre pompe doseuse est réglée à '+fmt(inj.injectorMax,0)+' L/h. Options : porter la pompe à ≈ '+fmt(inj.suggestedInjectorLh,0)+' L/h, '
              +'concentrer davantage la solution mère, ou répartir sur '+nInj+' injecteurs en parallèle.</div>';
          }else{
            body+='<div class="fc-ok" style="margin-top:8px;padding:7px 10px;background:rgba(95,177,90,.12);border:1px solid rgba(95,177,90,.4);border-radius:8px;color:#8fd08a;font-size:.74rem">✓ Pompe doseuse '+fmt(inj.injectorMax,0)+' L/h adaptée (requis '+fmt(inj.doserRateLh,0)+' L/h).</div>';
          }
        }
        body+='</div>';
      });
      body+='</div>';
    }
    body+='<div class="hint">'+window.t('eq_fert_note')+'</div>';
  }
  if(eq.type!=='pump'||true){
    body+='<div class="btn-row"><button class="tbtn ghost" style="color:var(--bad);border-color:#4a2b28" onclick="deleteEq(\''+eq.id+'\')">'+window.t('eq_delete')+'</button></div>';
  }
  body+='</div>';

function condFields(eq,cond,cfg){
  const P=parcelById(eq.parcelId);
  if(cond==='sonde'){

      +'<div><label>'+window.t('cond_vol_m3')+'</label><input type="number" step="1" value="'+(cfg.volume.m3==null?'':cfg.volume.m3)+'" placeholder="dose bilan" onchange="setCond(\''+eq.id+'\',\'volume\',\'m3\',this.value===\'\'?null:parseFloat(this.value))"></div>'
      +'<div><label>'+window.t('cond_vol_mm')+'</label><input type="number" step="0.5" value="'+(cfg.volume.mm==null?'':cfg.volume.mm)+'" placeholder="—" onchange="setCond(\''+eq.id+'\',\'volume\',\'mm\',this.value===\'\'?null:parseFloat(this.value))"></div>'

function editableCfg(eq){

  const i=c.order.indexOf(cond),j=i+dir;if(j<0||j>=c.order.length)return;

/* ---------- PLANNING ---------- */
function buildPlanning(){
  const rows=[];
  ST.parcels.forEach(p=>{
    const {b,diag}=computeParcelBilan(p);
    const valve=parcelEquipment(p.id).find(e=>e.type==='valve');
    const cfg=valve?(valve.stopConfig&&valve.stopConfig.inherit!==false?ST.cycles[0].stopConfig:valve.stopConfig):ST.cycles[0].stopConfig;
    const primary=cfg.order.find(c=>cfg[c].on)||'heure';
    const pump=valve?ST.equipment.find(e=>e.id===valve.pumpId):null;
    const flow=pump?pump.flowM3h:40;
    const durH=flow>0?b.volM3/flow:NaN;
    const urgent=diag.tone==='bad'||diag.key==='below';
    rows.push({p,b,diag,primary,volM3:b.volM3,durH,urgent,valve,pump});
  });
  rows.sort((a,b)=>(a.diag.tone==='bad'?0:a.diag.tone==='warn'?1:2)-(b.diag.tone==='bad'?0:b.diag.tone==='warn'?1:2));
  return rows;
}
function openPlanning(){
  const rows=buildPlanning();
  let t='<table class="ptbl"><thead><tr><th>Parcelle</th><th>État sol</th><th>Dose brute</th><th>Volume</th><th>Durée</th><th>Arrêt</th><th>Priorité</th></tr></thead><tbody>';
  if(!rows.length)t+='<tr><td colspan="7" style="text-align:center;color:var(--faint);padding:30px">Aucune parcelle. Dessinez-en une sur la carte.</td></tr>';
  rows.forEach(r=>{
    const c=CROPS[r.p.crop];
    const toneColor={good:'var(--good)',warn:'var(--warn)',bad:'var(--bad)'}[r.diag.tone];
    t+='<tr><td><span class="cropdot" style="background:'+c.color+'"></span>'+r.p.name+'</td>'
      +'<td style="color:'+toneColor+'">'+r.diag.txt+'</td>'
      +'<td class="tabnum">'+fmt(r.b.gross,0)+' mm</td>'
      +'<td class="tabnum">'+fmt(r.volM3,0)+' m³</td>'
      +'<td class="tabnum">'+(isNaN(r.durH)?'—':fmt(r.durH,1)+' h')+'</td>'
      +'<td>'+(r.valve?'auto':'<span style="color:var(--faint)">manuel</span>')+'</td>'
      +'<td><span class="pill '+r.primary+'">'+COND_META[r.primary].label+'</span></td></tr>';
  });
  t+='</tbody></table>';
  const totalVol=rows.reduce((s,r)=>s+(r.volM3||0),0);
  t+='<div style="margin-top:16px;display:flex;gap:20px;color:var(--muted);font-size:.85rem">'
    +'<span>Total à irriguer : <b style="color:var(--water)">'+fmt(totalVol,0)+' m³</b></span>'
    +'<span>Parcelles urgentes : <b style="color:var(--bad)">'+rows.filter(r=>r.diag.tone==='bad').length+'</b></span></div>';
  t+='<div class="btn-row" style="margin-top:16px"><button class="tbtn" onclick="exportPlanningCSV()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>Exporter le planning (CSV)</button></div>';
  openModal('Planning d’irrigation — '+ST.name,t);
}
window.exportPlanningCSV=()=>{

/* --- SVG line chart for soil moisture --- */
function moistureChart(series,b){
  const W=880,H=220,pad=38;
  const xs=series.series,n=xs.length;
  const maxT=xs[n-1].t;
  const yMin=Math.min(b.pf-2,Math.min(...xs.map(d=>d.moist)));
  const yMax=Math.max(b.cc+2,Math.max(...xs.map(d=>d.moist)));
  const X=t=>pad+(t/maxT)*(W-pad*1.2);
  const Y=v=>H-pad-((v-yMin)/(yMax-yMin))*(H-pad*1.6);
  const path=xs.map((d,i)=>(i?'L':'M')+X(d.t).toFixed(1)+' '+Y(d.moist).toFixed(1)).join(' ');
  let band='';
  // confort/sr/cc reference lines
  const lines=[['CC',b.cc,'#2ea8d8'],['Confort',b.confort,'#5fb15a'],['Seuil',b.sr,'#d99a2b'],['PF',b.pf,'#d1584e']];
  let refs=lines.map(([lb,v,c])=>'<line x1="'+pad+'" x2="'+(W-pad*0.2)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="'+c+'" stroke-width="1" stroke-dasharray="4 5" opacity=".55"/>'
    +'<text x="'+(W-pad*0.2+2)+'" y="'+(Y(v)+3)+'" fill="'+c+'" font-size="10">'+lb+'</text>').join('');
  // irrigation markers
  let ev=(series.events||[]).map(e=>'<line x1="'+X(e.day)+'" x2="'+X(e.day)+'" y1="'+(pad*0.4)+'" y2="'+(H-pad)+'" stroke="#2ea8d8" stroke-width="1" opacity=".25"/>').join('');
  // x axis day ticks
  let ticks='';for(let d=0;d<=maxT;d+=Math.ceil(maxT/10)){ticks+='<text x="'+X(d)+'" y="'+(H-pad+16)+'" fill="#5f7568" font-size="10" text-anchor="middle">J'+d+'</text>';}
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'
    +'<rect x="'+pad+'" y="'+(pad*0.4)+'" width="'+(W-pad*1.4)+'" height="'+(H-pad*1.4)+'" fill="#0b1210" stroke="#2b3a30"/>'
    +ev+refs
    +'<path d="'+path+'" fill="none" stroke="#e8efe6" stroke-width="2"/>'
    +ticks
    +'<text x="'+pad+'" y="18" fill="#8fa596" font-size="10">% vol.</text></svg>'
    +'<div class="chart-legend"><span><i style="background:#e8efe6"></i>Humidité sol</span>'
    +'<span><i class="dash" style="color:#5fb15a"></i>Confort</span><span><i class="dash" style="color:#d99a2b"></i>Seuil recharge</span>'
    +'<span><i style="background:#2ea8d8;opacity:.4"></i>Irrigation</span></div>';
}
/* --- valve chart: volume cumulé + moisture, dual axis --- */
function valveChart(irr,b,flow){
  const W=880,H=220,pad=42;
  const tr=irr.trace,n=tr.length;const maxT=Math.max(tr[n-1].t,1);
  const maxV=Math.max(irr.volumeM3,irr.stopM3||0,1);
  const X=t=>pad+(t/maxT)*(W-pad*1.4);
  const Yv=v=>H-pad-(v/maxV)*(H-pad*1.6);
  const yMoMin=b.pf,yMoMax=b.cc+2;
  const Ym=v=>H-pad-((v-yMoMin)/(yMoMax-yMoMin))*(H-pad*1.6);
  const volPath=tr.map((d,i)=>(i?'L':'M')+X(d.t).toFixed(1)+' '+Yv(d.vol).toFixed(1)).join(' ');
  const moPath=tr.map((d,i)=>(i?'L':'M')+X(d.t).toFixed(1)+' '+Ym(d.moist).toFixed(1)).join(' ');
  let refs='';
  if(irr.stopM3)refs+='<line x1="'+pad+'" x2="'+(W-pad*0.4)+'" y1="'+Yv(irr.stopM3)+'" y2="'+Yv(irr.stopM3)+'" stroke="#c9a24b" stroke-width="1" stroke-dasharray="4 5"/><text x="'+(pad+4)+'" y="'+(Yv(irr.stopM3)-4)+'" fill="#c9a24b" font-size="10">consigne '+fmt(irr.stopM3,0)+' m³</text>';
  if(irr.targetPct)refs+='<line x1="'+pad+'" x2="'+(W-pad*0.4)+'" y1="'+Ym(irr.targetPct)+'" y2="'+Ym(irr.targetPct)+'" stroke="#5fb15a" stroke-width="1" stroke-dasharray="4 5"/><text x="'+(pad+4)+'" y="'+(Ym(irr.targetPct)-4)+'" fill="#5fb15a" font-size="10">cible '+fmt(irr.targetPct,0)+'%</text>';
  const closeX=irr.closedAt!=null?X(irr.closedAt):null;
  let closeMark=closeX!=null?'<line x1="'+closeX+'" x2="'+closeX+'" y1="'+(pad*0.4)+'" y2="'+(H-pad)+'" stroke="#d1584e" stroke-width="1.5"/><text x="'+(closeX+4)+'" y="'+(pad*0.4+12)+'" fill="#d1584e" font-size="10">fermeture ('+irr.reason+')</text>':'';
  let ticks='';const step=Math.ceil(maxT/60/2)*60||60;for(let m=0;m<=maxT;m+=step){ticks+='<text x="'+X(m)+'" y="'+(H-pad+16)+'" fill="#5f7568" font-size="10" text-anchor="middle">'+(m/60).toFixed(0)+'h</text>';}
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'
    +'<rect x="'+pad+'" y="'+(pad*0.4)+'" width="'+(W-pad*1.8)+'" height="'+(H-pad*1.4)+'" fill="#0b1210" stroke="#2b3a30"/>'
    +refs+closeMark
    +'<path d="'+volPath+'" fill="none" stroke="#2ea8d8" stroke-width="2"/>'
    +'<path d="'+moPath+'" fill="none" stroke="#c9a24b" stroke-width="2"/>'
    +ticks
    +'<text x="'+pad+'" y="18" fill="#2ea8d8" font-size="10">m³ cumulés</text></svg>'
    +'<div class="chart-legend"><span><i style="background:#2ea8d8"></i>Volume cumulé (compteur)</span>'
    +'<span><i style="background:#c9a24b"></i>Humidité sol</span><span><i style="background:#d1584e"></i>Point de fermeture</span></div>';
}
/* --- ET0 forecast bar chart --- */
function et0Chart(){
  const d=ST.meteo?ST.meteo.daily.slice(0,7):[];
  const W=880,H=180,pad=38;const max=Math.max(...d.map(x=>x.et0),1);
  const bw=(W-pad*1.4)/d.length;
  let bars=d.map((x,i)=>{
    const h=(x.et0/max)*(H-pad*1.6);const bx=pad+i*bw+bw*0.2;const by=H-pad-h;
    const dn=new Date(x.date).toLocaleDateString('fr-FR',{weekday:'short'});
    return '<rect x="'+bx+'" y="'+by+'" width="'+(bw*0.6)+'" height="'+h+'" fill="#1c7fa8" rx="3"/>'
      +'<text x="'+(bx+bw*0.3)+'" y="'+(by-5)+'" fill="#7cc7e6" font-size="10" text-anchor="middle">'+fmt(x.et0,1)+'</text>'
      +'<text x="'+(bx+bw*0.3)+'" y="'+(H-pad+15)+'" fill="#5f7568" font-size="10" text-anchor="middle">'+dn+'</text>';
  }).join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+bars
    +'<text x="'+pad+'" y="16" fill="#8fa596" font-size="10">ET₀ mm/j</text></svg>';
}

function slug(s){return (s||'projet').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
function projectJSON(){
