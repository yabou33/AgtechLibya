/* ===== RUNTIME ===== */
/* ============================================================
   SIMULATION TEMPS RÉEL — horloge accélérée qui rejoue les
   tâches d'irrigation. Calcule l'état de chaque vanne + les
   compteurs m³ à un instant t. Play/pause/vitesse/scrubber.
   ============================================================ */
(function(global){
'use strict';
const A=global.AGRO;

/* État runtime global */
const RT={
  running:false,
  t:0,            // temps courant en minutes depuis 00:00
  tStart:600,     // début fenêtre (10:00)
  tEnd:720,       // fin fenêtre (12:00)
  speed:120,      // minutes simulées par seconde réelle
  tasks:[],       // tâches à rejouer [{valveId,start,duration,reason,flowM3h,...}]
  timer:null,
  onTick:null     // callback(t, states)
};

/* prépare une session à partir de tâches (d'un jour donné) */
function loadSession(tasks, ST, opts={}){
  RT.ST=ST;
  RT.tasks=tasks.map(t=>{
    const v=ST.equipment.find(e=>e.id===t.valveId);
    const pump=v?ST.equipment.find(e=>e.id===v.pumpId):null;
    const p=v?ST.parcels.find(x=>x.id===v.parcelId):null;
    // cycles de fertigation ciblant cette parcelle
    let fert=null;
    if(p&&global.FERTIGATION){
      const stations=ST.equipment.filter(e=>e.type==='fertigation');
      for(const stn of stations){
        const cy=(stn.cycles||[]).find(c=>c.parcelId===p.id);
        if(cy){
          const prod=global.FERTIGATION.productById(cy.productId);
          const volM3=(pump?pump.flowM3h:40)*(t.duration/60);
          const inj=global.FERTIGATION.computeInjection({volM3,durMin:t.duration,targetKgHa:cy.targetKgHa||5,areaHa:p?p.area:1,product:prod,injectorLh:stn.injectorLh,motherConcGL:stn.motherConcGL});
          fert={stationId:stn.id,stationName:stn.name,productName:prod?prod.name:'—',productColor:prod?prod.color:'#3fb8a8',
                amount:inj.productAmount,unit:inj.unit,injStart:t.start+inj.injStartMin,injEnd:t.start+inj.injEndMin,
                injRate:inj.injRate,doserRateLh:inj.doserRateLh,overCapacity:inj.overCapacity,tankL:stn.tankL};
          break;
        }
      }
    }
    return {...t, flowM3h:pump?pump.flowM3h:40, pumpId:v?v.pumpId:null, parcelId:p?p.id:null,
            area:p?p.area:1, parcelName:p?p.name:'—', valveName:v?v.name:t.valveId, fert};
  });
  // fenêtre = min/max des tâches, élargie
  if(RT.tasks.length){
    const starts=RT.tasks.map(t=>t.start), ends=RT.tasks.map(t=>t.start+t.duration);
    RT.tStart=opts.tStart!=null?opts.tStart:Math.max(0,Math.min(...starts)-30);
    RT.tEnd=opts.tEnd!=null?opts.tEnd:Math.min(1440,Math.max(...ends)+30);
  }else{RT.tStart=opts.tStart??600;RT.tEnd=opts.tEnd??720;}
  RT.t=RT.tStart;
}

/* état de toutes les vannes à l'instant t : ouverte/fermée + volume délivré */
function stateAt(t){
  const states={}; const pumpFlow={}; const injections={}; // + injections fertigation
  RT.tasks.forEach(tk=>{
    const open = t>=tk.start && t<(tk.start+tk.duration);
    const elapsed = Math.max(0, Math.min(t,tk.start+tk.duration) - tk.start); // min écoulées
    const vol = tk.flowM3h * (elapsed/60); // m³ délivrés jusqu'à t
    const prev=states[tk.valveId];
    states[tk.valveId]={
      open: open || (prev&&prev.open),
      volume:(prev?prev.volume:0)+vol,
      flow: open?tk.flowM3h:0,
      reason:tk.reason, valveName:tk.valveName, parcelName:tk.parcelName,
      pumpId:tk.pumpId, start:tk.start, end:tk.start+tk.duration,
      target: tk.flowM3h*(tk.duration/60)
    };
    if(open&&tk.pumpId){pumpFlow[tk.pumpId]=(pumpFlow[tk.pumpId]||0)+tk.flowM3h;}
    // --- fertigation : injection active dans sa fenêtre ---
    if(tk.fert){
      const f=tk.fert;
      const injOn = t>=f.injStart && t<f.injEnd;
      const injElapsed = Math.max(0, Math.min(t,f.injEnd) - f.injStart); // min
      const injectedTotalMin = f.injEnd - f.injStart;
      const injected = injectedTotalMin>0 ? f.amount*(injElapsed/injectedTotalMin) : 0; // kg/L injectés
      const key=f.stationId;
      const prevI=injections[key];
      injections[key]={
        stationName:f.stationName, productName:f.productName, productColor:f.productColor,
        on: injOn || (prevI&&prevI.on),
        injected:(prevI?prevI.injected:0)+injected,
        total:(prevI?prevI.total:0)+f.amount,
        unit:f.unit, rate:injOn?f.injRate:0, doserLh:injOn?f.doserRateLh:0, tankL:f.tankL,
        parcelName:tk.parcelName, overCapacity:f.overCapacity,
        window:[f.injStart,f.injEnd]
      };
    }
  });
  return {states, pumpFlow, injections, t};
}

function fmtClock(t){const h=Math.floor(t/60)%24,m=Math.floor(t%60);return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');}

function play(){
  if(RT.running)return;
  RT.running=true;
  let last=performance.now();
  const loop=(now)=>{
    if(!RT.running)return;
    const dtSec=(now-last)/1000; last=now;
    RT.t += dtSec*RT.speed;
    if(RT.t>=RT.tEnd){RT.t=RT.tEnd;RT.running=false;if(RT.onTick)RT.onTick(RT.t,stateAt(RT.t),true);return;}
    if(RT.onTick)RT.onTick(RT.t,stateAt(RT.t),false);
    RT.timer=requestAnimationFrame(loop);
  };
  RT.timer=requestAnimationFrame(loop);
}
function pause(){RT.running=false;if(RT.timer)cancelAnimationFrame(RT.timer);}
function seek(t){RT.t=Math.max(RT.tStart,Math.min(RT.tEnd,t));if(RT.onTick)RT.onTick(RT.t,stateAt(RT.t),false);}
function reset(){pause();RT.t=RT.tStart;if(RT.onTick)RT.onTick(RT.t,stateAt(RT.t),false);}
function setSpeed(s){RT.speed=s;}

global.RUNTIME={RT,loadSession,stateAt,play,pause,seek,reset,setSpeed,fmtClock};
})(typeof window!=='undefined'?window:globalThis);

/* ============================================================
   UI de la simulation temps réel : barre de contrôle flottante
   sur la carte + animation des marqueurs vannes + mini-panneau.
   Ces fonctions utilisent les globals de l'app (ST, layerIndex...).
   ============================================================ */
(function(global){
'use strict';
const R=global.RUNTIME;
let panelEl=null, barEl=null, active=false;

/* démarre une session et affiche l'UI */
global.startLiveSim=function(tasks, opts){
  if(!tasks||!tasks.length){global.toast&&toast('Aucune tâche à simuler','err');return;}
  R.loadSession(tasks, global.ST, opts||{});
  active=true;
  ensureUI();
  R.RT.onTick=onTick;
  R.reset();
  global.toast&&toast('Simulation prête — appuyez sur ▶');
};
global.stopLiveSim=function(){
  R.pause();active=false;
  if(barEl){barEl.remove();barEl=null;}
  if(panelEl){panelEl.remove();panelEl=null;}
  // remettre les vannes à leur état de base
  restoreValves();
};

function ensureUI(){
  if(!barEl){
    barEl=document.createElement('div');barEl.className='sim-bar';
    document.querySelector('.body').appendChild(barEl);
  }
  if(!panelEl){
    panelEl=document.createElement('div');panelEl.className='sim-panel';
    document.querySelector('.body').appendChild(panelEl);
  }
  renderBar();
}

function renderBar(){
  const rt=R.RT;
  barEl.innerHTML=
    '<button class="sim-btn play" id="simPlay">'+(rt.running?icoPause():icoPlay())+'</button>'
    +'<button class="sim-btn" id="simReset" title="Retour au début">'+icoReset()+'</button>'
    +'<div class="sim-clock" id="simClock">'+R.fmtClock(rt.t)+'</div>'
    +'<input type="range" class="sim-scrub" id="simScrub" min="'+rt.tStart+'" max="'+rt.tEnd+'" value="'+rt.t+'" step="1">'
    +'<div class="sim-range">'+R.fmtClock(rt.tStart)+'–'+R.fmtClock(rt.tEnd)+'</div>'
    +'<select class="sim-speed" id="simSpeed">'
      +[[60,'×60'],[120,'×120'],[300,'×300'],[600,'×600'],[1200,'×1200']].map(([v,l])=>'<option value="'+v+'"'+(rt.speed===v?' selected':'')+'>'+l+'</option>').join('')
    +'</select>'
    +'<button class="sim-btn close" id="simClose" title="Fermer">✕</button>';
  document.getElementById('simPlay').onclick=()=>{if(R.RT.running){R.pause();}else{R.play();}renderBar();};
  document.getElementById('simReset').onclick=()=>{R.reset();renderBar();};
  document.getElementById('simScrub').oninput=(e)=>{R.pause();R.seek(+e.target.value);renderBar();};
  document.getElementById('simSpeed').onchange=(e)=>R.setSpeed(+e.target.value);
  document.getElementById('simClose').onclick=()=>global.stopLiveSim();
}
const icoPlay=()=>'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>';
const icoPause=()=>'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
const icoReset=()=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 5 4 12l7 7M4 12h13a3 3 0 0 1 0 6h-1"/></svg>';

function onTick(t, snap, ended){
  // horloge + scrubber
  const clk=document.getElementById('simClock');if(clk)clk.textContent=R.fmtClock(t);
  const scr=document.getElementById('simScrub');if(scr&&!scr.matches(':active'))scr.value=t;
  if(ended){renderBar();global.toast&&toast('Irrigation terminée');}
  animateValves(snap, ended);
  animateParcels(snap, ended);
  renderPanel(snap);
}

/* colore les marqueurs vannes : en cours (pulse cyan) / terminé (vert) / à venir (gris) */
function animateValves(snap, ended){
  Object.keys(snap.states).forEach(vid=>{
    const st=snap.states[vid];
    const layer=global.layerIndex&&global.layerIndex[vid];
    if(!layer||!layer.getElement)return;
    const elm=layer.getElement();if(!elm)return;
    const body=elm.querySelector('.eqpin-body');
    if(!body)return;
    const done = !st.open && st.volume>0;   // a irrigué puis fermé = terminé
    body.classList.toggle('sim-open', st.open);
    body.classList.toggle('sim-done', !st.open && done);
    body.classList.toggle('sim-closed', !st.open && !done);
  });
}

/* colore les PARCELLES selon l'état d'irrigation de leur vanne */
function animateParcels(snap, ended){
  if(!global.ST||!global.layerIndex)return;
  // map parcelle -> état agrégé de ses vannes
  global.ST.parcels.forEach(p=>{
    const valves=global.ST.equipment.filter(e=>e.type==='valve'&&e.parcelId===p.id);
    let open=false, done=false, prog=0;
    valves.forEach(v=>{const st=snap.states[v.id];if(st){if(st.open)open=true;if(!st.open&&st.volume>0)done=true;
      if(st.target>0)prog=Math.max(prog,Math.min(1,st.volume/st.target));}});
    const layer=global.layerIndex[p.id];if(!layer)return;
    // couleur cible : bleu eau en cours, vert terminé, couleur culture sinon
    let color, fill;
    if(open){color='#2ea8d8';fill=0.15+prog*0.4;}      // bleu, remplissage progressif
    else if(done){color='#5fb15a';fill=0.32;}          // vert = irrigué
    else{const c=global.CROPS&&global.CROPS[p.crop];color=c?c.color:'#7d9153';fill=0.28;}
    setLayerStyle(layer,color,fill);
  });
}
function setLayerStyle(layer,color,fillOpacity){
  if(layer.setStyle){layer.setStyle({color,fillColor:color,fillOpacity});}
  else if(layer.eachLayer){layer.eachLayer(l=>{if(l.setStyle)l.setStyle({color,fillColor:color,fillOpacity});});}
}

function restoreValves(){
  if(!global.layerIndex)return;
  Object.values(global.layerIndex).forEach(layer=>{
    if(layer&&layer.getElement){const e=layer.getElement();if(e){const b=e.querySelector('.eqpin-body');if(b){b.classList.remove('sim-open','sim-closed','sim-done');}}}
  });
  // restaurer la couleur d'origine des parcelles
  if(global.ST&&global.refreshParcelColor){global.ST.parcels.forEach(p=>global.refreshParcelColor(p));}
}

function renderPanel(snap){
  if(!panelEl)return;
  const vids=Object.keys(snap.states);
  let h='<div class="sp-head">'+window.t('lv_tracking')+'<span>'+R.fmtClock(snap.t)+'</span></div><div class="sp-body">';

  });
  vids.forEach(vid=>{

  const injs=snap.injections?Object.keys(snap.injections):[];
  if(injs.length){
    h+='<div class="sp-fert-t">'+window.t('lv_fertig')+'</div>';
    injs.forEach(k=>{
      const f=snap.injections[k];
      const pct=f.total>0?Math.min(100,f.injected/f.total*100):0;
      const tankPct=f.tankL?Math.max(0,100-(f.injected/f.tankL*100)):100; // approximation cuve
      h+='<div class="sp-fert '+(f.on?'on':(f.injected>0?'done':''))+'" style="--fc:'+f.productColor+'">'
        +'<div class="sp-f-top"><span class="sp-f-dot" style="background:'+f.productColor+'"></span>'
        +'<b>'+f.productName+'</b><span class="sp-f-st">'+(f.on?window.t('lv_injection'):(f.injected>0?window.t('lv_finished'):window.t('lv_waiting')))+'</span></div>'
        +'<div class="sp-f-parc">→ '+f.parcelName+'</div>'
        +'<div class="sp-meter"><div class="sp-fill" style="width:'+pct+'%;background:'+f.productColor+'"></div></div>'
        +'<div class="sp-nums"><span class="sp-vol" style="color:'+f.productColor+'">'+Math.round(f.injected)+' '+f.unit+'</span>'
        +'<span class="sp-of">/ '+Math.round(f.total)+' '+f.unit+'</span>'
        +'<span class="sp-flow2">'+(f.on?Math.round(f.doserLh)+' L/h':'—')+'</span></div>'
        +'<div class="sp-tank"><span>'+window.t('lv_tank')+'</span><div class="sp-tank-bar"><i style="width:'+tankPct+'%"></i></div></div>'
        +'</div>';
    });
  }
  h+='</div>';
  panelEl.innerHTML=h;

function renderTabBar(){

window.switchTab=(id)=>{

  // Le suivi de simulation (barre + panneau) n'appartient qu'à la carte :
  // on le masque sur les autres onglets, on le réaffiche sur la carte.
  const simEls=document.querySelectorAll('.sim-bar,.sim-panel');
  simEls.forEach(el=>{el.style.display=(id==='map')?'':'none';});
  // La carte reste toujours dans le DOM avec sa taille ; on la cache derrière le panneau
  // (visibility plutôt que display:none, pour que Leaflet garde ses dimensions).
  if(id==='map'){
    panel.style.display='none';
    mapView.style.visibility='visible';
    mapView.style.zIndex='1';
    // recalcul fiable de la taille après que le navigateur a rendu la mise en page
    if(window.map){
      const fix=()=>{try{window.map.invalidateSize(true);}catch(e){}};
      requestAnimationFrame(()=>{fix();requestAnimationFrame(fix);});
      [60,200,450].forEach(d=>setTimeout(fix,d));
    }
  }else{
    mapView.style.zIndex='0';
    panel.style.display='block';
    renderTabPanel();
  }
  if(id==='station'&&!stationState)refreshStation();
};

// localisation de la station : parcelle sélectionnée, sinon domaine
function stationLoc(){
  const p=focusParcel();
  if(p){const c=p.center||(p.pivot?[p.pivot.lat,p.pivot.lng]:null);
    if(c)return {name:p.name,lat:c[0],lng:c[1],meteo:p._meteo};}
  return {name:ST.location.name,lat:ST.location.lat,lng:ST.location.lng,meteo:ST.meteo};
}
window.refreshStation=()=>{
  const loc=stationLoc();
  const p=focusParcel();
  // s'assurer que la parcelle a chargé sa météo
  if(p&&!p._meteo&&window.ensureParcelMeteo){window.ensureParcelMeteo(p);}
  // premier relevé : dérivé de la météo réelle de CETTE position ; sinon tick
  if(loc.meteo&&loc.meteo.current){stationState=window.STATION.fromLive(loc.meteo.current);}
  else stationState=window.STATION.tick(loc);
  if(currentTab==='station')renderTabPanel();
};
function stationView(){
  const loc=stationLoc();
  // (re)génère un relevé si absent ou si on a changé de parcelle
  if(!stationState||stationState._loc!==loc.name){
    stationState = (loc.meteo&&loc.meteo.current)?window.STATION.fromLive(loc.meteo.current):window.STATION.seed(loc);
    stationState._loc=loc.name;
  }
  const s=stationState;
  const t=(new Date(s.ts)).toLocaleTimeString(window.I18N&&window.I18N.getLang()==='en'?'en-GB':(window.I18N&&window.I18N.getLang()==='ar'?'ar':'fr-FR'));
  const g=(label,val,unit,extra,tone)=>
    '<div class="scard"><div class="sc-h">'+label+'</div>'
    +'<div class="sc-v '+(tone||'')+'">'+val+'<small>'+unit+'</small></div>'
    +(extra||'')+'</div>';
  // wind rose
  const rose=windRose(s.windDir,s.windAvg,s.windGust);
  return '<div class="station-head"><div>'+window.t('wm_reading')+' · <b>'+loc.name+'</b> · '+loc.lat.toFixed(3)+', '+loc.lng.toFixed(3)+' · '+t+'</div>'
    +'<button class="tbtn primary" onclick="refreshStation()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.8-3.4L23 10M1 14l4.7 4.4A9 9 0 0 0 20.5 15"/></svg>'+window.t('wm_refresh')+'</button></div>'
    +'<div class="station-grid">'
    + g(window.t('wm_temp'),'<span class="tabnum">'+s.temp+'</span>','°C','<div class="sc-x">'+window.t('wm_dew')+' '+s.dewPoint+' °C</div>',tempTone(s.temp))
    + g(window.t('wm_hum'),'<span class="tabnum">'+s.hum+'</span>','%','<div class="sc-x">'+humLabel(s.hum)+'</div>')
    + '<div class="scard wind"><div class="sc-h">'+window.t('wm_wind')+'</div>'+rose
      +'<div class="sc-x">'+window.t('wm_avg')+' '+(s.windAvg*3.6).toFixed(1)+' km/h · '+window.t('wm_gust')+' '+(s.windGust*3.6).toFixed(1)+' km/h · '+window.STATION.dirName(s.windDir)+' '+Math.round(s.windDir)+'°</div></div>'
    + g(window.t('wm_press'),'<span class="tabnum">'+s.pressure+'</span>','hPa','<div class="sc-x">'+pressLabel(s.pressure)+'</div>')
    + g(window.t('wm_rad'),'<span class="tabnum">'+s.solar+'</span>','W/m²','<div class="sc-x">UVI '+s.uvi+'</div>',solarTone(s.solar))
    + g(window.t('wm_rain'),'<span class="tabnum">'+s.rainDaily+'</span>','mm','<div class="sc-x">Taux '+s.rainRate+' mm/h · année '+s.rainYear+' mm</div>')
    +'</div>'
    +'<div class="hint" style="margin-top:14px">'+window.t('wm_note')+'</div>';
}
function windRose(dir,avg,gust){
  const cx=70,cy=70,r=52;
  const rad=(dir-90)*Math.PI/180;
  const ax=cx+Math.cos(rad)*r,ay=cy+Math.sin(rad)*r;
  let ticks='';for(let a=0;a<360;a+=30){const rr=(a%90===0)?r+6:r;const t=(a-90)*Math.PI/180;
    ticks+='<line x1="'+(cx+Math.cos(t)*(r-4))+'" y1="'+(cy+Math.sin(t)*(r-4))+'" x2="'+(cx+Math.cos(t)*rr)+'" y2="'+(cy+Math.sin(t)*rr)+'" stroke="#2b3a30" stroke-width="1.5"/>';}
  const labels=[['N',0],['E',90],['S',180],['O',270]].map(([l,a])=>{const t=(a-90)*Math.PI/180;
    return '<text x="'+(cx+Math.cos(t)*(r+15))+'" y="'+(cy+Math.sin(t)*(r+15)+4)+'" fill="#8fa596" font-size="11" text-anchor="middle">'+l+'</text>';}).join('');
  return '<svg viewBox="0 0 140 140" style="width:130px;height:130px;margin:4px auto;display:block">'
    +'<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#0b1210" stroke="#2b3a30"/>'
    +'<circle cx="'+cx+'" cy="'+cy+'" r="'+(r*0.6)+'" fill="none" stroke="#1c2a23"/>'
    +ticks+labels
    +'<line x1="'+cx+'" y1="'+cy+'" x2="'+ax+'" y2="'+ay+'" stroke="#2ea8d8" stroke-width="3" stroke-linecap="round"/>'
    +'<circle cx="'+cx+'" cy="'+cy+'" r="4" fill="#2ea8d8"/>'
    +'<text x="'+cx+'" y="'+(cy+3)+'" fill="#e8efe6" font-size="13" font-weight="700" text-anchor="middle">'+Math.round(dir)+'°</text></svg>';
}
const tempTone=(t)=>t>38?'bad':t>32?'warn':'';
const solarTone=(s)=>s>700?'warn':'';
const humLabel=(h)=>h<30?window.t('wm_dry'):h>75?window.t('wm_humid'):window.t('wm_comfort');
const pressLabel=(p)=>p<1005?window.t('wm_lowp'):p>1020?window.t('wm_highp'):window.t('wm_stable');

/* ---------- ANALYSE CLIMATIQUE ---------- */
async function loadClimate(){
  const c=focusCenter();
  const end=new Date(),start=new Date();start.setFullYear(start.getFullYear()-1);
  const panel=document.querySelector('#tabPanel .panel-scroll');
  if(panel)panel.innerHTML='<div class="loading-box">Chargement de l’historique climatique (Open-Meteo)…</div>';
  const r=await window.CLIMATE.fetchClimate(c[0],c[1],start.toISOString().slice(0,10),end.toISOString().slice(0,10));
  climateData=r;
  if(currentTab==='climate')renderTabPanel();
}
window.setClimateBy=(by)=>{climateBy=by;renderTabPanel();};
let climateChartMode='temp';
window.setClimateChart=(m)=>{climateChartMode=m;renderTabPanel();};
function climateView(){
  if(!climateData)return '<div class="loading-box">Chargement…</div>';
  const days=climateData.days;
  const st=window.CLIMATE.climateStats(days);
  const agg=window.CLIMATE.aggregate(days,climateBy);
  const cards='<div class="clim-cards">'
    +climCard('Pluie annuelle',st.rain,'mm','#8b7fd8','rain')
    +climCard('Temp. moyenne',st.tmean,'°C','#e08a8a','temp')
    +climCard('ETP annuelle',st.et0,'mm','#3fb8a8','etp')
    +climCard('Bilan hydrique',st.balance,'mm',st.balance<0?'#d1584e':'#5fb15a','bal')
    +climCard('Jours > 35°C',st.hotDays,'j','#e0a53f','hot')
    +'</div>';
  const filterBar='<div class="clim-filter"><div class="seg">'
    +segBtn('week',window.t('seg_week'),climateBy)+segBtn('month',window.t('seg_month'),climateBy)+segBtn('year',window.t('seg_year'),climateBy)+'</div>'
    +'<div class="seg right"><button class="'+(climateChartMode==='temp'?'on':'')+'" onclick="setClimateChart(\'temp\')">'+window.t('cl_temps')+'</button>'
    +'<button class="'+(climateChartMode==='rain'?'on':'')+'" onclick="setClimateChart(\'rain\')">'+window.t('cl_precip')+'</button></div></div>';
  const chart=climateChartMode==='temp'?tempChart(agg):rainEtpChart(agg);
  const table=synthTable(agg);
  const src='<div class="src-tag">Source : '+climateData.source+(climateData.ok?'':' (indisponible — données simulées)')+'</div>';
  return cards+filterBar+'<div class="chartwrap big">'+chart+'</div>'+src
    +'<h3 class="sect">'+window.t('cl_synth')+' '+({week:window.t('cl_weekly'),month:window.t('cl_monthly'),year:window.t('cl_yearly')})[climateBy]+'</h3>'+table;
}
function climCard(label,val,unit,color,ic){
  return '<div class="ccard" style="--cc:'+color+'"><div class="cc-ic"></div>'
    +'<div class="cc-v tabnum">'+fmt(val,1)+' <small>'+unit+'</small></div><div class="cc-l">'+label+'</div></div>';
}
function segBtn(v,l,cur){return '<button class="'+(cur===v?'on':'')+'" onclick="setClimateBy(\''+v+'\')">'+l+'</button>';}

function tempChart(agg){
  const W=980,H=300,pad=44;
  const n=agg.length;const xs=agg.map((a,i)=>pad+(i/(Math.max(1,n-1)))*(W-pad*1.4));
  const all=agg.flatMap(a=>[a.tmax,a.tmin]);const yMin=Math.min(...all,0),yMax=Math.max(...all,40);
  const Y=v=>H-pad-((v-yMin)/(yMax-yMin))*(H-pad*1.7);
  const line=(f,col)=>{const p=agg.map((a,i)=>(i?'L':'M')+xs[i].toFixed(1)+' '+Y(a[f]).toFixed(1)).join(' ');
    const dots=agg.map((a,i)=>'<circle cx="'+xs[i].toFixed(1)+'" cy="'+Y(a[f]).toFixed(1)+'" r="3" fill="'+col+'"/>').join('');
    return '<path d="'+p+'" fill="none" stroke="'+col+'" stroke-width="2.5"/>'+dots;};
  let grid='';for(let g=0;g<=40;g+=10){grid+='<line x1="'+pad+'" x2="'+(W-pad*0.4)+'" y1="'+Y(g)+'" y2="'+Y(g)+'" stroke="#1c2a23"/><text x="'+(pad-8)+'" y="'+(Y(g)+4)+'" fill="#5f7568" font-size="11" text-anchor="end">'+g+'</text>';}
  let xlabels=agg.map((a,i)=>(i%Math.ceil(n/12||1)===0)?'<text x="'+xs[i]+'" y="'+(H-pad+18)+'" fill="#5f7568" font-size="10" text-anchor="middle">'+a.label+'</text>':'').join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+grid
    +line('tmax','#e0655a')+line('tmin','#4a9fd8')+xlabels
    +'<text x="'+pad+'" y="20" fill="#8fa596" font-size="11">°C</text></svg>'
    +'<div class="chart-legend"><span><i style="background:#e0655a"></i>T° max</span><span><i style="background:#4a9fd8"></i>T° min</span></div>';
}
function rainEtpChart(agg){
  const W=980,H=300,pad=48;const n=agg.length;
  const bw=(W-pad*1.6)/n;
  const maxRain=Math.max(...agg.map(a=>a.rain),10),maxEtp=Math.max(...agg.map(a=>a.et0),10);
  const Yr=v=>H-pad-(v/maxRain)*(H-pad*1.7);
  const Ye=v=>H-pad-(v/maxEtp)*(H-pad*1.7);
  const bars=agg.map((a,i)=>{const x=pad+i*bw+bw*0.18;const h=(H-pad)-Yr(a.rain);
    return '<rect x="'+x+'" y="'+Yr(a.rain)+'" width="'+(bw*0.64)+'" height="'+Math.max(0,h)+'" fill="#4a9fd8" rx="3"/>';}).join('');
  const etpLine=agg.map((a,i)=>(i?'L':'M')+(pad+i*bw+bw*0.5).toFixed(1)+' '+Ye(a.et0).toFixed(1)).join(' ');
  const etpDots=agg.map((a,i)=>'<circle cx="'+(pad+i*bw+bw*0.5).toFixed(1)+'" cy="'+Ye(a.et0).toFixed(1)+'" r="3.5" fill="#e0a53f" stroke="#0e1512"/>').join('');
  let xlabels=agg.map((a,i)=>(i%Math.ceil(n/12||1)===0)?'<text x="'+(pad+i*bw+bw*0.5)+'" y="'+(H-pad+18)+'" fill="#5f7568" font-size="10" text-anchor="middle">'+a.label+'</text>':'').join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+bars
    +'<path d="'+etpLine+'" fill="none" stroke="#e0a53f" stroke-width="2.5"/>'+etpDots+xlabels
    +'<text x="'+pad+'" y="20" fill="#4a9fd8" font-size="11">Pluie mm</text>'
    +'<text x="'+(W-pad*0.6)+'" y="20" fill="#e0a53f" font-size="11" text-anchor="end">ETP mm</text></svg>'
    +'<div class="chart-legend"><span><i style="background:#4a9fd8"></i>Précipitations</span><span><i style="background:#e0a53f"></i>ETP</span></div>';
}
function synthTable(agg){
  let r='<table class="ptbl clim"><thead><tr><th>Période</th><th>T° max</th><th>T° min</th><th>Précip.</th><th>ETP</th><th>Bilan hydrique</th></tr></thead><tbody>';
  agg.forEach(a=>{const bc=a.balance<0?'#d1584e':'#5fb15a';
    r+='<tr><td><b>'+a.label+'</b></td><td style="color:#e0655a">'+fmt(a.tmax,1)+' °C</td>'
      +'<td style="color:#4a9fd8">'+fmt(a.tmin,1)+' °C</td><td style="color:#7cc7e6">'+a.rain+' mm</td>'
      +'<td style="color:#e0a53f">'+a.et0+' mm</td><td style="color:'+bc+';text-align:end;font-weight:700">'+(a.balance>0?'+':'')+a.balance+' mm</td></tr>';});
  r+='</tbody></table>';return r;
}

/* ---------- ANALYSE DU SOL ---------- */
function ensureSoilFocus(){
  const p=focusParcel();
  if(p&&!p._soilInfo&&p.center){fetchParcelSoil(p,false).then(()=>{if(currentTab==='soil')renderTabPanel();});}
}
function soilView(){

  const ru=cc-pf;

  const tex=p.texture||(window.SOIL&&window.SOIL.defaultTextureFor?window.SOIL.defaultTextureFor(p.soil):{clay:18,silt:42,sand:40});
  const locale=window.I18N&&window.I18N.getLang()==='ar'?'ar':(window.I18N&&window.I18N.getLang()==='en'?'en-GB':'fr-FR');
  const c=p.center||(p.pivot?[p.pivot.lat,p.pivot.lng]:null);

  h+='<h3 class="sect">'+window.t('so_texture')+'</h3><div class="soil-cards">'
    +soilCard(window.t('so_clay'),tex.clay,'%','#7d9153',tex.clay)
    +soilCard(window.t('so_sand'),tex.sand,'%','#c9a24b',tex.sand)
    +soilCard(window.t('so_silt'),tex.silt,'%','#5fb15a',tex.silt)+'</div>';
  h+='<h3 class="sect">'+window.t('so_hydric')+'</h3><div class="soil-cards wide">'
    +soilCard(window.t('so_cc'),cc,'% vol.','#2ea8d8')
    +soilCard(window.t('so_pf'),pf,'% vol.','#d1584e')
    +soilCard(window.t('so_ruf'),ru,'% vol.','#5fb15a')
    +soilCard(window.t('so_soiltype'),A.SOILS[p.soil].label,'','#8fa596')
    +soilCard(window.t('so_infil'),A.SOILS[p.soil].infil,'mm/h','#c9a24b')+'</div>';
  h+='<div class="hint" style="margin-top:12px">'+window.t('so_note')+'</div>';

  return h;
}
function soilCard(label,val,unit,color,bar){
  const barHtml=(bar!=null&&bar!=='—')?'<div class="sbar"><i style="width:'+Math.min(100,bar)+'%;background:'+color+'"></i></div>':'';
  return '<div class="soil-card"><div class="sc-ic2" style="background:'+color+'22;color:'+color+'"></div>'
    +'<div class="sc-l2">'+label+'</div><div class="sc-v2 tabnum">'+(typeof val==='number'?fmt(val,1):val)+' <small>'+unit+'</small></div>'+barHtml+'</div>';
}

/* ---------- SATELLITE & INDICES ---------- */
function indicesView(){
  const p=focusParcel();
  const b8=0.42,b4=0.08,b5=0.14,b11=0.30; // valeurs démo (à brancher sur API satellite plus tard)
  const nd=A.ndvi(b8,b4),ndw=A.ndwi(b8,b11),ndre=(b8-b5)/(b8+b5);
  const gauge=(label,val,ranges,unit)=>{
    const pct=A.clamp((val+1)/2*100,0,100);
    return '<div class="idx-card"><div class="idx-h">'+label+'</div>'
      +'<div class="idx-v tabnum">'+fmt(val,3)+'</div>'
      +'<div class="idx-bar"><div class="idx-scale"></div><div class="idx-cur" style="left:'+pct+'%"></div></div>'
      +'<div class="idx-i">'+ranges+'</div></div>';
  };
  const ndviI=nd<0.2?'Sol nu / très faible':nd<0.4?'Couvert faible ou stress':nd<0.6?'Couvert modéré':'Végétation dense et vigoureuse';
  const ndwiI=ndw<0?'Stress hydrique':ndw<0.1?'Contenu en eau faible':'Bonne turgescence foliaire';
  return (p?'':emptyPanel('Sélectionnez une parcelle pour cibler l’analyse — valeurs de démonstration affichées.'))
    +'<div class="idx-grid">'
    +gauge('NDVI',nd,ndviI)
    +gauge('NDWI',ndw,ndwiI)
    +gauge('NDRE',ndre,'Vigueur / azote foliaire')
    +'</div>'
    +'<div class="hint" style="margin-top:14px">NDVI = (B8−B4)/(B8+B4) · NDWI = (B8−B11)/(B8+B11) · NDRE = (B8−B5)/(B8+B5). Le NDWI chute avant le NDVI : indicateur précoce du stress hydrique. Branchable sur Sentinel Hub / bandes Sentinel-2 réelles.</div>';
}

/* ---------- CALCULS DÉTAILLÉS (formules dépliables) ---------- */
let openCalc={};
window.toggleCalc=(k)=>{openCalc[k]=!openCalc[k];renderTabPanel();};
function calcView(){
  const p=focusParcel();
  const et0=et0Today(p);
  const doy=Math.floor((Date.now()-new Date(new Date().getFullYear(),0,0))/864e5);
  const d0=ST.meteo&&ST.meteo.daily[0]?ST.meteo.daily[0]:{tmax:38,tmin:22};
  const et0in={tmax:d0.tmax,tmin:d0.tmin,rhmax:d0.rhmax||70,rhmin:d0.rhmin||30,
    u2:(d0.wind||3.2),rs:d0.rs||26.5,z:50,lat:ST.location.lat,doy,albedo:0.23};
  const steps=window.CLIMATE.et0Steps(et0in);
  let h='<div class="hint" style="margin-bottom:14px">'+(p?window.t('calc_intro_parcel')+' « '+p.name+' »':window.t('calc_intro_domain'))+'. '+window.t('calc_click')+'</div>';
  h+='<div class="calc-grid">';

  // ET0 block
  h+=calcBlock('et0',window.t('calc_et0_title'),fmt(steps[steps.length-1].val,2)+' mm/j',
    steps.map(s=>'<div class="cstep"><div class="cs-sym">'+s.sym+'</div><div class="cs-main">'
      +'<div class="cs-lbl">'+window.t(s.lblKey)+'</div>'+(openCalc.et0?'<div class="cs-f">'+s.f+'</div>':'')+'</div>'
      +'<div class="cs-val tabnum">'+fmt(s.val,s.d||2)+' <small>'+s.u+'</small></div></div>').join(''));

  if(p){
    const {b}=computeParcelBilan(p);
    const crop=CROPS[p.crop];
    // Kc block
    h+=calcBlock('kc',window.t('calc_kc_title'),fmt(b.kc,2),
      '<div class="cstep"><div class="cs-sym">Kc</div><div class="cs-main"><div class="cs-lbl">'+crop.label+' · '+window.t('cc_stage')+' '+({ini:'initial',mid:'médian',end:'fin'})[p.stage]+'</div>'
      +(openCalc.kc?'<div class="cs-f">'+window.t('cc_table')+'</div>':'')+'</div><div class="cs-val tabnum">'+fmt(b.kc,2)+'</div></div>');
    // ETc + bilan
    h+=calcBlock('etc',window.t('calc_bilan_title'),fmt(b.gross,1)+' mm',
       crow(window.t('bl_etc'),b.etc,'mm/j',openCalc.etc,fmt(et0,2)+' × '+fmt(b.kc,2))
      +crow(window.t('bl_peff'),b.peff,'mm',openCalc.etc,'pluie × coeff')
      +crow(window.t('bl_net'),b.net,'mm',openCalc.etc,'sur 7 jours')
      +crow(window.t('bl_ei'),p.ei,'',openCalc.etc)
      +(b.lr>0?crow(window.t('bl_lr'),b.lr,'',openCalc.etc,'ECw/(5·ECe−ECw)'):'')
      +crow(window.t('bl_gross'),b.gross,'mm',openCalc.etc,'',true)
      +crow(window.t('bl_vol'),b.volM3,'m³',openCalc.etc,fmt(b.gross,1)+' mm × '+fmt(p.area,2)+' ha × 10',true));
    // seuils sol
    h+=calcBlock('sol',window.t('calc_sol_title'),fmt(b.sr,1)+' % vol.',
       crow(window.t('so_ru'),b.ru,'% vol.',openCalc.sol,fmt(b.cc,0)+' − '+fmt(b.pf,0))
      +crow(window.t('so_sr'),b.sr,'% vol.',openCalc.sol,'',true)
      +crow(window.t('so_confort'),b.confort,'% vol.',openCalc.sol)
      +crow(window.t('so_rfu'),b.rfuMM,'mm',openCalc.sol)
      +crow(window.t('so_interval'),b.interval,'jours',openCalc.sol,'RFU / ETc',true));
    // WUE
    h+=calcBlock('wue',window.t('calc_wue_title'),'—',
      '<div class="hint">'+window.t('wue_todo')+'</div>');
  }else{
    h+='<div class="empty" style="padding:24px;grid-column:1/-1">'+window.t('calc_select_parcel')+'</div>';
  }
  h+='</div>'; // calc-grid
  return h;
}
function calcBlock(k,title,result,inner){
  return '<div class="calc-block"><div class="calc-head" onclick="toggleCalc(\''+k+'\')">'
    +'<div class="calc-t"><span class="chev '+(openCalc[k]?'open':'')+'">▸</span>'+title+'</div>'
    +'<div class="calc-r tabnum">'+result+'</div></div><div class="calc-body">'+inner+'</div></div>';
}
function crow(label,val,unit,showF,f,big){
  return '<div class="cstep'+(big?' big':'')+'"><div class="cs-sym"></div><div class="cs-main">'
    +'<div class="cs-lbl">'+label+'</div>'+(showF&&f?'<div class="cs-f">'+f+'</div>':'')+'</div>'
    +'<div class="cs-val tabnum">'+fmt(val,2)+' <small>'+unit+'</small></div></div>';
}

const DAYS_FR=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const VALVE_COLORS=['#2ea8d8','#5fb15a','#e08a2b','#d1584e','#9b6dd8','#c9a24b','#3fb8a8'];

/* Vue SEMAINE : lignes = vannes, colonnes = 7 jours */
function ganttWeekView(valves){
  let h='<div class="gantt week"><div class="g-head"><div class="g-corner">'+window.t('pl_valve')+'</div>'
    +DAYS_FR.map(d=>'<div class="g-col-h">'+d+'</div>').join('')+'</div>';
  valves.forEach((v,vi)=>{
    const col=VALVE_COLORS[vi%VALVE_COLORS.length];
    const p=ST.parcels.find(x=>x.id===v.parcelId);
    h+='<div class="g-row"><div class="g-lbl"><span class="g-dot" style="background:'+col+'"></span>'
      +'<div><b>'+v.name+'</b><small>'+(p?p.name:'—')+'</small></div></div>';
    for(let day=0;day<7;day++){
      const tsk=planTasks.filter(t=>t.valveId===v.id&&t.day===day);
      h+='<div class="g-cell" onclick="openAddTask(\''+v.id+'\','+day+')">';
      tsk.forEach(t=>{
        h+='<div class="g-bar" style="background:'+col+'" onclick="event.stopPropagation();openEditTask(\''+t.id+'\')" title="'+window.PLANNER.minToHHMM(t.start)+'–'+window.PLANNER.minToHHMM(t.start+t.duration)+'">'
          +'<span>'+window.PLANNER.minToHHMM(t.start)+'</span></div>';
      });
      h+='</div>';
    }
    h+='</div>';
  });
  h+='</div><div class="hint" style="margin-top:8px">'+window.t('pl_click_hint')+'</div>';
  return h;
}

/* Vue JOURNÉE : lignes = vannes, axe = 24 h, barres positionnées à l'heure */
function ganttDayView(valves){
  const H0=0,H1=24,pxPerH=42;
  let h='<div class="gantt day"><div class="gd-timeline"><div class="gd-corner"></div><div class="gd-hours">';
  for(let hr=H0;hr<H1;hr+=2)h+='<div class="gd-h" style="width:'+(pxPerH*2)+'px">'+String(hr).padStart(2,'0')+'h</div>';
  h+='</div></div>';
  // ligne pompe (busy)
  const pumps=ST.equipment.filter(e=>e.type==='pump');
  valves.forEach((v,vi)=>{
    const col=VALVE_COLORS[vi%VALVE_COLORS.length];
    const p=ST.parcels.find(x=>x.id===v.parcelId);
    h+='<div class="gd-row"><div class="gd-lbl"><span class="g-dot" style="background:'+col+'"></span><div><b>'+v.name+'</b><small>'+(p?p.name:'—')+'</small></div></div>';
    h+='<div class="gd-track" onclick="openAddTask(\''+v.id+'\','+ganttDay+')">';
    planTasks.filter(t=>t.valveId===v.id&&t.day===ganttDay).forEach(t=>{
      const left=(t.start/60)*pxPerH, width=Math.max(24,(t.duration/60)*pxPerH);
      h+='<div class="gd-bar" style="left:'+left+'px;width:'+width+'px;background:'+col+'" onclick="event.stopPropagation();openEditTask(\''+t.id+'\')">'
        +'<span>'+window.PLANNER.minToHHMM(t.start)+'–'+window.PLANNER.minToHHMM(t.start+t.duration)+'</span>'
        +'<small>'+fmt(t.volumeM3,0)+' m³ · '+COND_META[t.reason].label+'</small></div>';
    });
    h+='</div></div>';
  });
  // pompes
  pumps.forEach(pump=>{
    const segs=window.PLANNER.pumpBusy(planTasks,ST,pump.id).filter(s=>s.day===ganttDay);
    h+='<div class="gd-row pump"><div class="gd-lbl"><span class="g-dot" style="background:#e08a2b"></span><div><b>'+pump.name+'</b><small>'+pump.flowM3h+' m³/h</small></div></div>';
    h+='<div class="gd-track">';
    segs.forEach(s=>{const left=(s.a/60)*pxPerH,width=Math.max(20,((s.b-s.a)/60)*pxPerH);
      h+='<div class="gd-bar pump" style="left:'+left+'px;width:'+width+'px"><span>'+window.t('pl_running')+'</span></div>';});
    h+='</div></div>';
  });
  h+='</div><div class="hint" style="margin-top:8px">'+window.t('pl_pump_line')+'</div>';
  return h;
}

  if(!dayTasks.length){toast('Aucune tâche ce jour-là. Régénérez ou ajoutez des tâches.','err');return;}
  switchTab('map');
  setTimeout(()=>startLiveSim(dayTasks,{}),300);
};
// Lancement manuel : choisir vannes + plage horaire
window.openManualLive=()=>{
  const valves=ST.equipment.filter(e=>e.type==='valve');
  if(!valves.length){toast('Aucune vanne à simuler','err');return;}
  const vBoxes=valves.map(v=>'<label class="mv-check"><input type="checkbox" value="'+v.id+'" checked> '+v.name+'</label>').join('');
  openModal('Lancer une irrigation manuelle',
    '<div class="fld"><label>Électrovannes à ouvrir</label><div class="mv-list">'+vBoxes+'</div></div>'
    +'<div class="fld"><div class="row"><div><label>Ouverture</label><input type="time" id="ml_start" value="10:00"></div>'
    +'<div><label>Fermeture</label><input type="time" id="ml_end" value="12:00"></div></div></div>'
    +'<div class="hint">Toutes les vannes cochées s’ouvrent sur la plage choisie. Le compteur monte selon le débit de leur pompe.</div>'
    +'<div class="btn-row"><button class="tbtn primary" onclick="startManualLive()" style="flex:1;justify-content:center"><svg viewBox="0 0 24 24" fill="currentColor" style="width:14px;height:14px"><path d="M7 4v16l13-8z"/></svg> Lancer</button></div>');
};
window.startManualLive=()=>{
  const checked=[...document.querySelectorAll('.mv-list input:checked')].map(c=>c.value);
  if(!checked.length){toast('Sélectionnez au moins une vanne','err');return;}
  const start=window.PLANNER.hhmmToMin(document.getElementById('ml_start').value);
  const end=window.PLANNER.hhmmToMin(document.getElementById('ml_end').value);
  const dur=Math.max(1,end-start);
  const tasks=checked.map(vid=>{
    const v=ST.equipment.find(e=>e.id===vid);
    const cfg=v.stopConfig&&v.stopConfig.inherit!==false?ST.cycles[0].stopConfig:v.stopConfig;
    const reason=(cfg&&cfg.order?cfg.order.find(c=>cfg[c]&&cfg[c].on):'heure')||'heure';
    return {id:'ml-'+vid,valveId:vid,day:0,start,duration:dur,reason,volumeM3:0,doseMm:0,auto:false};
  });
  closeModal();switchTab('map');
  setTimeout(()=>startLiveSim(tasks,{tStart:Math.max(0,start-15),tEnd:Math.min(1440,end+15)}),300);
};


/* ---------- RECOMMANDATIONS ---------- */
let recoOpen=true;
window.toggleReco=()=>{recoOpen=!recoOpen;renderTabPanel();};
function renderRecommendations(){
  const ctx={computeBilan:computeParcelBilan, pumpFor:(p)=>{
    const v=ST.equipment.find(e=>e.type==='valve'&&e.parcelId===p.id);
    return v?ST.equipment.find(e=>e.id===v.pumpId):null;
  }};
  const {recos,totalM3,toIrrigate}=window.RECO.forDomain(ST,ctx);
  const tips=window.RECO.generalTips(ST,ST.meteo);
  const uMeta={
    critical:{c:'#d1584e',lbl:window.t('rc_urgent'),ic:'⚠'},
    now:{c:'#e08a2b',lbl:window.t('rc_today'),ic:'●'},
    soon:{c:'#d99a2b',lbl:window.t('rc_soon'),ic:'○'},
    ok:{c:'#5fb15a',lbl:window.t('rc_ok'),ic:'✓'},
    info:{c:'#8fa596',lbl:window.t('rc_info'),ic:'ℹ'}
  };
  let h='<div class="reco-box">';
  h+='<div class="reco-head" onclick="toggleReco()"><div class="reco-h-t"><span class="chev '+(recoOpen?'open':'')+'">▸</span>'+window.t('rc_title')+'</div>'
    +'<div class="reco-h-s">'+toIrrigate+' '+window.t('rc_toirrig')+' · '+fmt(totalM3,0)+' '+window.t('rc_advised')+'</div></div>';
  if(recoOpen){
    h+='<div class="reco-body">';
    // conseils généraux
    if(tips.length){h+='<div class="reco-tips">'+tips.map(t=>'<div class="reco-tip">'+tipIcon(t.icon)+'<span>'+t.txt+'</span></div>').join('')+'</div>';}
    // cartes par parcelle
    h+='<div class="reco-grid">';
    recos.forEach(r=>{
      const u=uMeta[r.urgency];
      const crop=CROPS[r.crop];
      h+='<div class="reco-card" style="--uc:'+u.c+'">'
        +'<div class="rc-top"><span class="rc-badge">'+u.ic+' '+u.lbl+'</span>'
        +'<span class="rc-name"><span class="cropdot" style="background:'+(crop?crop.color:'#888')+'"></span>'+r.parcelName+'</span></div>'
        +'<div class="rc-action">'+window.t(r.actionKey)+'</div>'
        +'<div class="rc-when">'+window.t(r.whenKey)+'</div>';
      if(['critical','now','soon'].includes(r.urgency)){
        h+='<div class="rc-nums">'
          +numCell(window.t('rc_dose'),r.doseMm,'mm')+numCell(window.t('rc_volume'),fmt(r.doseM3,0),'m³')
          +numCell(r.isPivot?window.t('rc_rotation'):window.t('rc_duration'),r.durH,'h')+numCell(window.t('rc_freq'),r.perWeek,'×/sem')+'</div>';
        let detail=''+window.t('rc_slot')+' : <b>'+r.bestSlot+'</b> · ETc '+r.etc+' mm/j · Kc '+r.kc;
        if(r.sessions>1)detail+=' · '+r.sessions+' passages sur '+r.intervalDays+' j';
        h+='<div class="rc-detail">'+detail+'</div>';
        if(!r.flowOk&&r.neededFlow){
          h+='<div class="rc-warn">⚠ Débit installé '+fmt(r.installedFlow,0)+' m³/h → rotation '+r.durH+' h (trop long). Pour une rotation de '+r.rotH+' h, viser ≈ <b>'+fmt(r.neededFlow,0)+' m³/h</b>.</div>';
        }else if(r.flowOk){
          h+='<div class="rc-ok">✓ Débit '+fmt(r.installedFlow,0)+' m³/h adapté — rotation ≈ '+r.durH+' h.</div>';
        }
      }else{
        h+='<div class="rc-detail">'+r.diagTxt+' · humidité '+r.moist+' % vol.</div>';
      }
      h+='</div>';
    });
    h+='</div></div>';
  }
  h+='</div>';
  return h;
}
function numCell(label,val,unit){return '<div class="rc-num"><span>'+label+'</span><b>'+val+'</b><small>'+unit+'</small></div>';}
function tipIcon(k){const m={sun:'☀',rain:'🌧',salt:'🧂',pivot:'⟳'};return '<span class="tip-ic">'+(m[k]||'•')+'</span>';}

</script>
