<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="0; url=platform/public/apps/carto.html">
<title>Redirection — AgriMap</title>
<style>
:root{--green:#7cb342;--green-d:#5a8f2c;--ink:#2c3a24;--muted:#6f7d64;--line:#d8e4c8;--paper:#fbfcf8;--card:#fff}
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Inter","Segoe UI",system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 18px rgba(60,80,40,.10);padding:32px 34px;max-width:460px;text-align:center}
.logo{width:52px;height:52px;border-radius:12px;background:linear-gradient(135deg,var(--green),var(--green-d));display:grid;place-items:center;color:#fff;font-weight:800;font-size:.8rem;margin:0 auto 18px}
h1{font-size:1.15rem;font-weight:800;margin-bottom:10px}
p{color:var(--muted);font-size:.92rem;line-height:1.5;margin-bottom:6px}
p[dir=rtl]{font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif}
a.btn{display:inline-block;margin-top:16px;background:var(--green);color:#fff;text-decoration:none;font-weight:700;padding:10px 20px;border-radius:9px}
a.btn:hover{background:var(--green-d)}
</style>
<script>location.replace("platform/public/apps/carto.html");</script>
</head>
<body>
<div class="card">
<div class="logo">AGRI<br>MAP</div>
<h1>Cette page a déménagé</h1>
<p>Redirection vers la carto de la plateforme…</p>
<p>This page has moved — redirecting to the platform…</p>
<p dir="rtl">انتقلت هذه الصفحة — جارٍ التحويل إلى المنصّة…</p>
<a class="btn" href="platform/public/apps/carto.html">Ouvrir AgriMap / Open / فتح</a>
</div>
</body>
</html>
